<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1a0b14">
<title>Bánh Mỳ Cổng Địa Ngục</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1a0b14; --panel:#2a1220; --panel2:#3a1626; --line:#5a2438;
  --gold:#ffcf4a; --red:#e8452c; --ink:#fff6e6; --muted:#e0bfae;
  --good:#5fd36b; --warn:#ffc23a; --bad:#ff4b3e; --paper:#fff6e4; --paperInk:#2b1320;
  color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:'Baloo 2',system-ui,-apple-system,'Segoe UI',sans-serif;overflow:hidden;
  user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font-family:inherit;color:inherit;border:0;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#stage{position:relative;flex:1;min-height:0;overflow:hidden}
#c{display:block;width:100%;height:100%;touch-action:none}
#bubbles{position:absolute;inset:0;pointer-events:none;overflow:hidden}

/* HUD */
#hud{position:absolute;left:0;right:0;top:0;display:flex;align-items:flex-start;justify-content:space-between;gap:8px;
  padding:calc(8px + env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) 0 max(12px, env(safe-area-inset-left));pointer-events:none}
.hgrp{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pill{pointer-events:auto;background:rgba(26,8,18,.78);border:2px solid var(--line);border-radius:999px;
  padding:2px 12px;font-weight:800;font-size:17px;display:flex;align-items:center;gap:6px;white-space:nowrap;
  box-shadow:0 3px 0 rgba(0,0,0,.35)}
#money{color:var(--gold)}
#chao{color:#ffe6c4}
#nightBox{flex-direction:column;border-radius:14px;line-height:1.05;padding:4px 14px;text-align:center}
#nightBox small{font-size:12px;color:var(--muted);font-weight:700}
#repBar{width:min(28vw,140px);height:12px;border-radius:99px;background:#43192b;overflow:hidden;border:2px solid #1a0812}
#repFill{height:100%;width:70%;background:var(--good);transition:width .3s,background .3s}
#mute{font-size:16px;padding:2px 9px}
#combo{position:absolute;left:12px;top:calc(48px + env(safe-area-inset-top));font-weight:800;color:var(--gold);
  font-size:15px;text-shadow:0 2px 0 #000;opacity:0;transition:opacity .2s}

/* Bubbles */
.bubble{position:absolute;left:0;top:0;transform:translate(-50%,-100%);pointer-events:auto;cursor:pointer;
  background:var(--paper);color:var(--paperInk);border-radius:14px;padding:4px 7px 7px;border:3px solid #2b1320;
  box-shadow:0 4px 0 rgba(0,0,0,.35);min-width:64px;max-width:min(160px,31vw);text-align:center;transition:opacity .3s}
.bubble::after{content:"";position:absolute;left:50%;bottom:-11px;transform:translateX(-50%);
  border:8px solid transparent;border-top-color:#2b1320}
.bubble .who{font-size:11px;font-weight:800;line-height:1.1;color:#7a2a3a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bubble .ord{display:flex;flex-wrap:wrap;justify-content:center;gap:1px 3px;font-size:clamp(16px,4.2vw,22px);line-height:1.15}
.bubble .ord + .ord{border-top:2px dashed #e0c8b4;margin-top:3px;padding-top:3px}
.bubble .ord span.done{opacity:.3}
.bubble .ord.served{font-size:13px;font-weight:800;color:#2f8a3a}
.bubble .pat{height:6px;border-radius:9px;background:#e8d7c8;margin-top:4px;overflow:hidden}
.bubble .pat i{display:block;height:100%;width:100%;background:var(--good);border-radius:9px}
.bubble.pair{border-color:#5a2a6a}
.bubble.react{font-size:30px;padding:2px 10px;min-width:0}
.float{position:absolute;transform:translate(-50%,-50%);font-weight:800;font-size:20px;color:var(--gold);
  text-shadow:0 2px 0 #000,0 0 8px rgba(0,0,0,.6);pointer-events:none;white-space:nowrap;animation:floatUp 1.4s ease-out forwards}
.float.bad{color:var(--bad)} .float.gift{color:#b7f0ff}
@keyframes floatUp{from{opacity:1;margin-top:0}to{opacity:0;margin-top:-60px}}
#toast{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:rgba(26,8,18,.85);
  border:2px solid var(--line);padding:4px 14px;border-radius:999px;font-weight:700;font-size:15px;opacity:0;
  transition:opacity .25s;pointer-events:none;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis}

/* Panel */
#panel{flex:none;background:linear-gradient(var(--panel2),var(--panel));border-top:3px solid var(--line);
  padding:8px max(10px, env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));display:flex;gap:10px}
.rows{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.row{display:flex;align-items:center;gap:6px;min-width:0}
.rl{flex:none;width:34px;font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;line-height:1;text-align:center}
.btns{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 4px}
.btns::-webkit-scrollbar{display:none}
.ing{flex:none;width:58px;height:56px;border-radius:14px;background:var(--paper);color:var(--paperInk);
  display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 4px 0 #b88f78;
  transition:transform .08s}
.ing b{font-size:24px;line-height:1}
.ing small{font-size:10.5px;font-weight:700;line-height:1.1;margin-top:2px;white-space:nowrap}
.ing:active,.ing.press{transform:translateY(3px);box-shadow:0 1px 0 #b88f78}
.ing.new{outline:3px solid var(--gold)}
.side{flex:none;width:104px;display:flex;flex-direction:column;gap:6px}
#current{flex:1;min-height:56px;background:rgba(0,0,0,.25);border:2px dashed var(--line);border-radius:12px;
  display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:0 2px;font-size:19px;padding:4px}
#current .hint{font-size:11px;color:var(--muted);text-align:center;line-height:1.2}
#trash{background:#5a2438;border-radius:12px;padding:6px 4px;font-weight:800;font-size:13px;box-shadow:0 3px 0 #2a0f1a}
#trash:active{transform:translateY(2px);box-shadow:0 1px 0 #2a0f1a}

@media (max-width:480px){
  #hud{gap:4px}
  .pill{font-size:15px;padding:1px 9px}
  #repBar{width:16vw}
  #mute{padding:1px 7px;font-size:14px}
  .side{width:84px}
  .ing{width:54px;height:54px}
  .ing b{font-size:22px}
  .ing small{font-size:10px}
}
@media (orientation:landscape) and (max-height:540px){
  #app{flex-direction:row}
  #panel{width:min(40vw,340px);border-top:0;border-left:3px solid var(--line);flex-direction:column;overflow-y:auto}
  .btns{flex-wrap:wrap;overflow:visible}
  .ing{width:52px;height:50px}
  .ing b{font-size:21px}
  .side{width:auto;flex-direction:row}
  #current{min-height:44px}
  #trash{width:96px}
  #repBar{width:min(14vw,90px)}
  .pill{font-size:15px;padding:1px 10px}
}

/* Screens */
#overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
  padding:max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  background:radial-gradient(ellipse at center,rgba(60,10,30,.55),rgba(10,2,8,.88));z-index:10}
#overlay.show{display:flex}
.card{width:min(460px,100%);max-height:100%;overflow-y:auto;background:linear-gradient(#3a1626,#22101a);
  border:3px solid var(--line);border-radius:22px;padding:20px 20px 18px;text-align:center;box-shadow:0 10px 0 rgba(0,0,0,.4)}
.card.wide{width:min(640px,100%)}
.card h1{margin:0;font-size:clamp(28px,8vw,42px);line-height:1;color:var(--gold);text-shadow:0 3px 0 #8a1f12,0 0 18px rgba(255,90,40,.45);letter-spacing:.5px;text-wrap:balance}
.card h2{margin:0 0 6px;font-size:26px;color:var(--gold)}
.card h3{margin:14px 0 6px;font-size:16px;color:var(--ink);text-align:left;letter-spacing:.3px}
.card p{margin:8px 0;color:var(--muted);font-size:15px;line-height:1.35}
.how{text-align:left;background:rgba(0,0,0,.25);border-radius:14px;padding:8px 12px;margin:12px 0;font-size:14.5px;line-height:1.45}
.big{display:block;width:100%;margin-top:10px;background:var(--red);border-radius:16px;padding:10px;font-size:20px;font-weight:800;
  box-shadow:0 5px 0 #8a1f12}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 #8a1f12}
.big.alt{background:#5a2438;box-shadow:0 5px 0 #2a0f1a;font-size:17px}
table.sum{width:100%;border-collapse:collapse;margin:10px 0;font-size:15px;font-variant-numeric:tabular-nums}
table.sum td{padding:4px 2px;border-bottom:1px solid rgba(255,255,255,.08);text-align:left}
table.sum td:last-child{text-align:right;font-weight:800}
.pos{color:var(--good)} .neg{color:var(--bad)}
.stars{font-size:34px;letter-spacing:4px;margin:4px 0}
.note{background:rgba(255,207,74,.12);border:1px solid rgba(255,207,74,.35);border-radius:12px;padding:6px 10px;font-size:14px;color:var(--ink);margin-top:8px}
.warn{background:rgba(255,75,62,.15);border-color:rgba(255,75,62,.5)}
.story div{opacity:0;transform:translateY(6px);transition:all .5s;margin:8px 0;font-size:16px;color:var(--ink)}
.story div.on{opacity:1;transform:none}
.wallet{position:sticky;top:-20px;z-index:1;background:#2c1220;margin:-4px -6px 6px;padding:6px;border-radius:12px;font-weight:800;color:var(--gold);font-size:20px}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}
.item{background:rgba(0,0,0,.25);border:2px solid var(--line);border-radius:14px;padding:8px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.item.has{border-color:rgba(95,211,107,.5)}
.item b{font-size:28px;line-height:1.1}
.item .nm{font-weight:800;font-size:14.5px;line-height:1.15}
.item .ef{font-size:12.5px;color:var(--muted);line-height:1.25;flex:1}
.buy{margin-top:6px;width:100%;background:var(--gold);color:#2b1320;border-radius:10px;padding:4px;font-weight:800;font-size:14px;box-shadow:0 3px 0 #a07a1a}
.buy:disabled{opacity:.35;cursor:not-allowed}
.owned{margin-top:6px;color:var(--good);font-weight:800;font-size:14px}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--muted);z-index:20;background:var(--bg)}
@media (prefers-reduced-motion:reduce){ .float{animation-duration:.01s} .story div{transition:none} }

/* ===== MỞ ĐẦU: CỐT TRUYỆN + TẠO NHÂN VẬT ===== */
.card.wide{width:min(780px,100%)}
.scene-art{position:relative;height:clamp(110px,24vh,180px);border-radius:16px;margin:0 0 10px;overflow:hidden;
  display:flex;align-items:flex-end;justify-content:center;gap:2px;padding-bottom:12px;font-size:clamp(42px,11vw,66px);line-height:1;
  background:linear-gradient(#1c0820,#5a1424);border:2px solid var(--line);cursor:pointer}
.scene-art.city{background:linear-gradient(#0f1636,#3a2a5a 70%,#2a1a24)}
.scene-art.fog{background:linear-gradient(#3a2a3a,#8a6a7a)}
.scene-art.hell{background:radial-gradient(ellipse at 50% 100%,#ff8a2a,#a3121a 45%,#2a0610)}
.scene-art.court{background:linear-gradient(#2a0d10,#5a1a1a);}
.scene-art .bg{position:absolute;opacity:.35;font-size:1.9em;bottom:-6px}
.scene-art .sm{font-size:.62em}
.scene-art img.av{height:115%;max-height:150px;width:auto;margin-bottom:-12px;filter:drop-shadow(0 4px 0 rgba(0,0,0,.45))}
.scene-art .sil{filter:brightness(0) drop-shadow(0 0 6px #ff7a1a)}
.scene-art .bob{animation:bob 1.6s ease-in-out infinite}
.scene-art .shake{animation:shk .18s linear infinite}
.scene-art .zoom{animation:zoom .6s ease-out}
@keyframes bob{50%{transform:translateY(-8px)}}
@keyframes shk{25%{transform:translate(-3px,1px) rotate(-3deg)}75%{transform:translate(3px,-1px) rotate(3deg)}}
@keyframes zoom{from{transform:scale(.3);opacity:0}}
.speaker{font-weight:800;color:var(--gold);font-size:15px;text-align:left;min-height:1.2em}
.say{min-height:4.3em;text-align:left;font-size:17px;line-height:1.4;color:var(--ink);cursor:pointer}
.dots{display:flex;gap:6px;justify-content:center;margin-top:10px}
.dots i{width:8px;height:8px;border-radius:9px;background:var(--line)} .dots i.on{background:var(--gold)}
.navrow{display:flex;gap:10px;align-items:center}
.navrow .big{flex:1}
.skip{background:none;color:var(--muted);font-weight:700;font-size:14px;padding:12px 4px 0;white-space:nowrap;flex:none}
.cc{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;text-align:left;margin-top:8px}
.cc>div{min-width:0}
@media (min-width:640px){.cc{grid-template-columns:250px minmax(0,1fr);align-items:start}}
#ccView{display:block;width:100%;height:clamp(160px,32vh,290px);border-radius:16px;touch-action:none;cursor:grab;
  background:radial-gradient(ellipse at 50% 70%,#7a2438,#2a0d18 75%);border:2px solid var(--line)}
.ccHint{font-size:12px;color:var(--muted);text-align:center;margin-top:2px}
.opt{margin:0 0 8px}
.opt>b{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px}
.ccName{display:flex;gap:6px}
.ccName input{flex:1;min-width:0;font:inherit;font-size:18px;font-weight:700;padding:5px 12px;border-radius:12px;
  border:2px solid var(--line);background:var(--paper);color:var(--paperInk);outline:none;user-select:text;-webkit-user-select:text}
.ccName input:focus{border-color:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:rgba(0,0,0,.3);border:2px solid var(--line);border-radius:999px;padding:3px 11px;font-weight:700;font-size:14px}
.chip.on{border-color:var(--gold);color:var(--gold);background:rgba(255,207,74,.14)}
.sw{width:30px;height:30px;border-radius:50%;padding:0;border:3px solid rgba(0,0,0,.45);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.sw.on{border-color:var(--gold);transform:scale(1.12)}
.meline{display:flex;align-items:center;justify-content:center;gap:8px;margin:10px 0 0;color:var(--ink);font-weight:700}
.meline img{width:42px;height:42px;border-radius:50%;background:#43192b;border:2px solid var(--line)}
.linkbtn{background:none;color:var(--muted);text-decoration:underline;font-weight:700;font-size:14px;padding:4px}
#meAv{width:26px;height:26px;border-radius:50%;margin:0 2px 0 -8px;background:#43192b;object-fit:cover}
#meName{font-size:14px;color:var(--ink);margin-right:4px;max-width:9em;overflow:hidden;text-overflow:ellipsis}
@media (max-width:700px),(max-height:540px){#meName{display:none}}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="bubbles"></div>
    <div id="hud">
      <div class="hgrp">
        <div class="pill" id="money">💰 <span id="moneyV">0</span></div>
        <div class="pill" id="chao" title="Cháo Lãng Quên: tha một lần sai món" hidden>🥣 <span id="chaoV">0</span></div>
      </div>
      <div class="pill" id="nightBox"><span id="nightV">Đêm 1</span><small id="timeV">2:00</small></div>
      <div class="hgrp">
        <div class="pill" title="Danh tiếng">😊 <div id="repBar"><div id="repFill"></div></div></div>
        <button class="pill" id="mute" aria-label="Tắt hoặc bật âm thanh">🔊</button>
      </div>
    </div>
    <div id="combo"></div>
    <div id="toast"></div>
  </div>
  <div id="panel">
    <div class="rows">
      <div class="row"><span class="rl">Nhân</span><div class="btns" data-type="nhan"></div></div>
      <div class="row"><span class="rl">Rau</span><div class="btns" data-type="rau"></div></div>
      <div class="row"><span class="rl">Sốt</span><div class="btns" data-type="sot"></div></div>
    </div>
    <div class="side">
      <div id="current"></div>
      <button id="trash">🗑️ Bỏ bánh</button>
    </div>
  </div>
</div>
<div id="overlay"><div class="card" id="card"></div></div>
<div id="loading">Đang mở cổng địa ngục…</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// Chờ font tiếng Việt tải xong để chữ vẽ lên biển hiệu 3D hiển thị đúng
try{ await Promise.race([document.fonts.load('800 72px "Baloo 2"'), new Promise(r=>setTimeout(r,2500))]); }catch(e){}

/* =========================================================
   DỮ LIỆU GAME
   ========================================================= */
// buy = giá mua trong cửa hàng (0 = có sẵn từ đầu)
const ING = {
  pate:     {name:'Pate chả',   emoji:'🐷', type:'nhan', price:10, buy:0,   color:0xb5714a, shape:'slab'},
  trung:    {name:'Trứng',      emoji:'🍳', type:'nhan', price:8,  buy:0,   color:0xffffff, shape:'egg'},
  thitnuong:{name:'Thịt nướng', emoji:'🥓', type:'nhan', price:12, buy:0,   color:0xa8442a, shape:'slab'},
  ga:       {name:'Gà xé',      emoji:'🍗', type:'nhan', price:13, buy:45,  color:0xe6b877, shape:'bits'},
  ximai:    {name:'Xíu mại',    emoji:'🧆', type:'nhan', price:14, buy:70,  color:0x9c4b2e, shape:'balls'},
  bo:       {name:'Bò lúc lắc', emoji:'🥩', type:'nhan', price:18, buy:110, color:0x6b2a1c, shape:'cubes'},
  heoquay:  {name:'Heo quay',   emoji:'🍖', type:'nhan', price:20, buy:140, color:0xd9822b, shape:'slab'},
  cahoi:    {name:'Cá hồi',     emoji:'🐟', type:'nhan', price:26, buy:200, color:0xff8a5c, shape:'slab'},
  dualeo:   {name:'Dưa leo',    emoji:'🥒', type:'rau',  price:1,  buy:0,   color:0x6cc04a, shape:'sticks'},
  dochua:   {name:'Đồ chua',    emoji:'🥕', type:'rau',  price:1,  buy:0,   color:0xff9a2e, shape:'sticks'},
  raumui:   {name:'Rau mùi',    emoji:'🌿', type:'rau',  price:1,  buy:0,   color:0x3fa83a, shape:'leaves'},
  ot:       {name:'Ớt',         emoji:'🌶️', type:'rau',  price:1,  buy:0,   color:0xe0201a, shape:'rings'},
  hanhphi:  {name:'Hành phi',   emoji:'🧅', type:'rau',  price:3,  buy:30,  color:0xc9893a, shape:'bits'},
  phomai:   {name:'Phô mai',    emoji:'🧀', type:'rau',  price:4,  buy:60,  color:0xffd23a, shape:'slab'},
  sotbo:    {name:'Sốt bơ',     emoji:'🧈', type:'sot',  price:2,  buy:0,   color:0xfff2b0, shape:'drizzle'},
  xidau:    {name:'Xì dầu',     emoji:'🍶', type:'sot',  price:1,  buy:0,   color:0x4a2410, shape:'drizzle'},
  tuongot:  {name:'Tương ớt',   emoji:'🔥', type:'sot',  price:2,  buy:30,  color:0xd8301c, shape:'drizzle'},
};
const CHILI = ['ot','tuongot'];
const STARTER = Object.keys(ING).filter(k=>ING[k].buy===0);

// Nâng cấp xe (mua bằng vàng mã giữa các đêm)
const UPG = {
  chuong: {name:'Chuông gió trấn hồn', emoji:'🎐', price:80,  desc:'Khách kiên nhẫn lâu hơn 25%'},
  denlong:{name:'Đèn lồng đỏ',         emoji:'🏮', price:70,  desc:'Khách kéo đến đông hơn 25%'},

let actx=null;
function tone(f, d=0.12, type='sine', v=0.12, slide=0, delay=0){
  if(state.muted) return;
  try{
    actx ??= new (window.AudioContext||window.webkitAudioContext)();
    const t0 = actx.currentTime + delay;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type=type; o.frequency.setValueAtTime(f,t0);
    if(slide) o.frequency.linearRampToValueAtTime(Math.max(30,f+slide), t0+d);
    g.gain.setValueAtTime(v,t0); g.gain.exponentialRampToValueAtTime(0.001,t0+d);
    o.connect(g).connect(actx.destination); o.start(t0); o.stop(t0+d+0.02);
  }catch(e){}
}

const gradMap = (()=>{
  const d = new Uint8Array([60,140,210,255]);
  const t = new THREE.DataTexture(d,4,1,THREE.RedFormat);
  t.minFilter = t.magFilter = THREE.NearestFilter; t.needsUpdate = true; return t;
})();
const matCache = new Map();
function toon(color, emissive=0){
  const key = color+'|'+emissive;
  if(!matCache.has(key)) matCache.set(key, new THREE.MeshToonMaterial({color, gradientMap:gradMap, emissive}));
  return matCache.get(key);
}
const outlineMat = new THREE.MeshBasicMaterial({color:0x1a0810, side:THREE.BackSide});
function part(geo, color, {outline=0.05, emissive=0, shadow=true}={}){
  const m = new THREE.Mesh(geo, toon(color, emissive));
  m.castShadow = shadow; m.receiveShadow = true;
  if(outline){ const o = new THREE.Mesh(geo, outlineMat); o.scale.setScalar(1+outline); m.add(o); }
  return m;
}
const basic = (color, opts={}) => new THREE.MeshBasicMaterial({color, ...opts});
function at(obj,x,y,z){ obj.position.set(x,y,z); return obj; }
function rot(obj,x=0,y=0,z=0){ obj.rotation.set(x,y,z); return obj; }
function textTexture(text,{w=512,h=128,bg='#2a0d10',fg='#ffcf4a',font='800 72px "Baloo 2", sans-serif',border='#ffcf4a',vertical=false}={}){
  const cv=document.createElement('canvas'); cv.width=w; cv.height=h; const g=cv.getContext('2d');
  g.fillStyle=bg; g.fillRect(0,0,w,h);
  if(border){ g.strokeStyle=border; g.lineWidth=8; g.strokeRect(10,10,w-20,h-20); }
  g.fillStyle=fg; g.font=font; g.textAlign='center'; g.textBaseline='middle';
  if(vertical){ const ch=[...text]; ch.forEach((c,i)=>g.fillText(c,w/2,(i+0.5)*h/ch.length)); }
  else g.fillText(text,w/2,h/2+4);
  const t=new THREE.CanvasTexture(cv); t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=4; return t;
}

  const cloud=new THREE.Group(); for(let i=0;i<6;i++) cloud.add(at(part(new THREE.SphereGeometry(0.22+(i%2)*0.06,10,8),0xffffff,{outline:0.05}),(i-2.5)*0.22,0.1,(i%2)*0.14-0.05)); g.add(cloud);
  legs(g,fur,{x:0.14,len:0.12,r:0.09,foot:0x3a2a1a,y:0.36});
  g.add(at(part(new THREE.CapsuleGeometry(0.3,0.32,6,14),armor),0,0.85,0));
  const plate=part(new THREE.BoxGeometry(0.36,0.3,0.08),gold,{outline:0.04}); at(plate,0,0.92,0.27); g.add(plate);
  const cape=part(new THREE.BoxGeometry(0.62,0.85,0.04),0xffb020,{outline:0.04}); at(cape,0,0.82,-0.3); cape.rotation.x=0.15; g.add(cape);
  g.add(at(part(new THREE.SphereGeometry(0.46,20,16),fur),0,1.52,0));
  for(const s of [-1,1]){ const f=part(new THREE.SphereGeometry(0.17,12,10),skin,{outline:0}); f.scale.set(1,1.1,0.5); at(f,s*0.11,1.56,0.33); g.add(f);
    g.add(at(part(new THREE.SphereGeometry(0.13,10,8),skin),s*0.47,1.55,0)); }
  const muz=part(new THREE.SphereGeometry(0.19,12,10),skin,{outline:0}); muz.scale.set(1.2,0.8,0.6); at(muz,0,1.36,0.33); g.add(muz);
  eyes(g,1.57,0.4,0.11,0.085);
  brows(g,1.7,0.43,0.12,-0.2,0x6a3a1a,0.1);
  smile(g,1.33,0.45,0.1,0x6a2010,0.022);
  const band=part(new THREE.TorusGeometry(0.46,0.04,8,28),gold,{outline:0.1}); band.rotation.x=Math.PI/2-0.1; at(band,0,1.72,0); g.add(band);
  const gem=part(new THREE.SphereGeometry(0.05,8,6),0xd8301c,{outline:0}); at(gem,0,1.73,0.46); g.add(gem);
  // hai lông trĩ
  const feathers=[]; for(const s of [-1,1]){ const f=tube([[s*0.12,1.78,0.2],[s*0.3,2.2,0.0],[s*0.55,2.55,-0.35],[s*0.85,2.6,-0.7]],0.025,0xd8301c,{outline:0.15}); g.add(f); feathers.push(f); }
  // gậy như ý
  const staff=new THREE.Group(); at(staff,0.5,1.0,0.25);
  staff.add(part(new THREE.CylinderGeometry(0.045,0.045,2.2,8),0xb3241a));
  for(const y of [-1.05,1.05]) staff.add(at(part(new THREE.CylinderGeometry(0.06,0.06,0.18,8),gold,{outline:0.05}),0,y,0));
  staff.rotation.z=-0.25; g.add(staff);
  const arms=[]; for(const s of [-1,1]){ const a=arm(armor,{len:0.24,r:0.075,hand:skin}); at(a,s*0.32,1.02,0.05); a.rotation.z=s*(s>0?0.2:0.45); g.add(a); arms.push(a); }
  g.add(tube([[-0.1,0.6,-0.3],[-0.4,0.5,-0.5],[-0.55,0.9,-0.55],[-0.4,1.1,-0.45]],0.04,fur));
  wobble(g,[arms[0]]);
  g.userData.top=2.55; g.userData.float=true;
  g.userData.anim=t=>{ feathers.forEach((f,i)=>f.rotation.z=Math.sin(t*3+i)*0.05); staff.rotation.z=-0.25+Math.sin(t*1.5)*0.08; };
  return g;
}

   BÁNH MỲ 3D TRÊN THỚT

const sandwichRoot = new THREE.Group(); at(sandwichRoot,0,COUNTER_Y+0.1,COUNTER_Z); scene.add(sandwichRoot);
let bread=null;
function makeBread(){
  const g=new THREE.Group();
  const geo=new THREE.CapsuleGeometry(0.27,1.55,6,16);
  const bot=part(geo,0xe8a64a,{outline:0.05}); bot.rotation.z=Math.PI/2; bot.scale.set(0.5,1,1.15); at(bot,0,0.02,0); g.add(bot);
  g.add(at(part(new THREE.BoxGeometry(1.6,0.04,0.32),0xfff0cf,{outline:0}),0,0.15,0));
  const top=part(geo,0xe39a3a,{outline:0.05}); top.rotation.z=Math.PI/2; top.scale.set(0.45,1,1.1); at(top,0,0.2,-0.42); top.rotation.x=-0.5; g.add(top);
  return g;
}
function ingredientMesh(key, layer){
  const d=ING[key], g=new THREE.Group(), y=0.18+layer*0.055, c=d.color;
  const R=(a,b)=>a+Math.random()*(b-a);
  switch(d.shape){
    case 'slab': g.add(at(part(new THREE.BoxGeometry(1.5,0.05,0.34),c,{outline:0.03}),0,y,0)); break;
    case 'egg': { const w=part(new THREE.CylinderGeometry(0.3,0.3,0.04,16),0xffffff,{outline:0.04}); w.scale.x=2.2; at(w,0,y,0); g.add(w);
      g.add(at(part(new THREE.SphereGeometry(0.12,12,8),0xffb320,{outline:0}),0.1,y+0.04,0)); break; }
    case 'bits': for(let i=0;i<12;i++) g.add(at(part(new THREE.SphereGeometry(R(.04,.07),6,5),c,{outline:0}),R(-.7,.7),y+R(0,.04),R(-.12,.12))); break;
    case 'balls': for(let i=0;i<4;i++) g.add(at(part(new THREE.SphereGeometry(0.13,10,8),c,{outline:0.05}),-0.55+i*0.37,y+0.06,0)); break;
    case 'cubes': for(let i=0;i<6;i++){ const b=part(new THREE.BoxGeometry(.15,.13,.15),c,{outline:0.05}); at(b,-0.6+i*0.24,y+0.05,R(-.06,.06)); b.rotation.y=R(0,1); g.add(b);} break;
    case 'sticks': for(let i=0;i<7;i++){ const s=part(new THREE.BoxGeometry(.42,.035,.035),c,{outline:0}); at(s,-0.6+i*0.2,y,R(-.1,.1)); s.rotation.y=R(-.5,.5); g.add(s);} break;
    case 'leaves': for(let i=0;i<8;i++){ const l=part(new THREE.SphereGeometry(.08,6,5),c,{outline:0}); l.scale.set(1.3,.3,1); at(l,R(-.7,.7),y+.02,R(-.15,.15)); g.add(l);} break;
    case 'rings': for(let i=0;i<7;i++){ const t=part(new THREE.TorusGeometry(.045,.018,5,10),c,{outline:0}); t.rotation.x=Math.PI/2; at(t,R(-.7,.7),y+.02,R(-.1,.1)); g.add(t);} break;
    case 'drizzle': { const pts=[]; for(let i=0;i<=10;i++) pts.push(new THREE.Vector3(-0.72+i*0.144, y+0.03, (i%2?0.11:-0.11)));
      g.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),40,0.025,6), toon(c))); break; }
  }
  return g;
}
const pops=[];
function pop(obj){ obj.scale.setScalar(0.01); pops.push({obj,t:0}); }
function resetBread(){
  if(bread) sandwichRoot.remove(bread);
  bread = makeBread(); sandwichRoot.add(bread); state.sandwich=[];
  pop(bread); renderCurrent();
}

/* =========================================================
   KHÁCH HÀNG
   ========================================================= */
const SLOTS = [{x:-2.6,z:1.4},{x:0,z:1.0},{x:2.6,z:1.4}].map(s=>({...s,busy:null}));
let slotScale = 1;
const customers=[];
const bubblesEl=document.getElementById('bubbles');
const rnd=(a,b)=>a+Math.random()*(b-a), pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a;};
const owned = k => state.owned.includes(k);

function makeSandwich(prefs){
  const n=state.night;
  let fills=Object.keys(ING).filter(k=>ING[k].type==='nhan'&&owned(k));
  let veg=Object.keys(ING).filter(k=>ING[k].type==='rau'&&owned(k));
  let sau=Object.keys(ING).filter(k=>ING[k].type==='sot'&&owned(k));
  if(prefs.noChili){ veg=veg.filter(k=>!CHILI.includes(k)); sau=sau.filter(k=>!CHILI.includes(k)); }
  // món mới mua được gọi nhiều hơn một chút
  const items=[ prefs.likes && owned(prefs.likes) && Math.random()<0.7 ? prefs.likes : pick([...fills, ...fills.filter(k=>ING[k].buy>0)]) ];
  const maxVeg=Math.min(veg.length, 1+Math.floor((n+1)/2));
  items.push(...shuffle(veg).slice(0,Math.floor(rnd(0,maxVeg+1))));
  items.push(...shuffle(sau).slice(0,Math.floor(rnd(0,(n>=2?2:1)+1))));
  if(prefs.wantsChili && !items.some(k=>CHILI.includes(k))) items.push('ot');
  return items;
}
function priceOf(order){ return order.reduce((s,k)=>s+ING[k].price,0) + (has('lo')?3:0); }
function patienceFor(def){ return Math.max(14, 30*def.patience*(1-0.05*(state.night-1))) * (has('chuong')?1.25:1); }

function createCustomer({type, def, name, build, prefs, slot, count=1, pat}){
  const mesh=build();
  mesh.position.set(slot.x*slotScale+rnd(-1.5,1.5)*0.5,0,-12.5); scene.add(mesh);
  const orders=Array.from({length:count},()=>makeSandwich(prefs));
  const cu={type, def, name, mesh, slot, sx:slotScale, orders, served:orders.map(()=>false), pat, st:'walk', t:Math.random()*10, blinkT:rnd(1,4), from:mesh.position.clone(), walkT:0};
  slot.busy=cu;
  const b=document.createElement('div'); b.className='bubble'; b.style.opacity='0';
  b.addEventListener('pointerdown',e=>{ e.stopPropagation(); serve(cu); });
  bubblesEl.appendChild(b); cu.bubble=b;
  renderBubble(cu);
  customers.push(cu);
  return cu;
}
function renderBubble(cu){
  const rows=cu.orders.map((o,i)=> cu.served[i]
    ? `<div class="ord served">✓ Xong ổ ${i+1}</div>`
    : `<div class="ord">${o.map(k=>`<span data-k="${k}" title="${ING[k].name}">${ING[k].emoji}</span>`).join('')}</div>`).join('');
  cu.bubble.className='bubble'+(cu.partner?' pair':'');
  cu.bubble.innerHTML=`<div class="who">${cu.partner?'🔗 ':''}${cu.name}${cu.orders.length>1?' · 2 ổ':''}</div>${rows}<div class="pat"><i></i></div>`;
  cu.patEl=cu.bubble.querySelector('.pat i');
}
function spawnCustomer(forced){
  const free=SLOTS.filter(s=>!s.busy); if(!free.length) return;
  const types=Object.keys(CUST).filter(k=>CUST[k].night<=state.night);
  const newest=types.filter(k=>CUST[k].night===Math.min(state.night,4));
  let type = forced || (Math.random()<0.35 && newest.length ? pick(newest) : pick(types));
  // Hắc Bạch Vô Thường luôn đi cùng nhau: cần 2 chỗ liền kề
  if(CUST[type].pair){
    const pairs=[[0,1],[1,2]].filter(([a,b])=>!SLOTS[a].busy&&!SLOTS[b].busy);
    if(!pairs.length){ type=pick(types.filter(k=>!CUST[k].pair)); }
    else {
      const [a,b]=pick(pairs), def=CUST.vothuong;
      const pat={v:patienceFor(def)*1.3}; pat.max=pat.v;
      const hac=createCustomer({type:'hac',def,name:PAIR.hac.name,build:PAIR.hac.build,prefs:PAIR.hac,slot:SLOTS[a],pat});
      const bach=createCustomer({type:'bach',def,name:PAIR.bach.name,build:PAIR.bach.build,prefs:PAIR.bach,slot:SLOTS[b],pat});
      hac.partner=bach; bach.partner=hac; renderBubble(hac); renderBubble(bach);
      return;
    }
  }
  const def=CUST[type];
  const pat={v:patienceFor(def)}; pat.max=pat.v;
  createCustomer({type,def,name:def.name,build:def.build,prefs:def,slot:pick(free),count:def.count||1,pat});
}
function leave(cu, mood){
  if(cu.st==='leave') return;
  cu.st='leave'; cu.mood=mood; cu.walkT=0; cu.from=cu.mesh.position.clone();
  cu.slot.busy=null;
  const side = cu.slot.x<0?-1: cu.slot.x>0?1 : (Math.random()<.5?-1:1);
  cu.to=new THREE.Vector3(side*13,0,cu.mesh.position.z-3);
  cu.bubble.className='bubble react'; cu.bubble.innerHTML = mood==='happy'?'😋':mood==='angry'?'😡':mood==='closed'?'😴':'💢';
  setTimeout(()=>{ cu.bubble.style.opacity='0'; },900);
}
function removeCustomer(cu){
  scene.remove(cu.mesh); cu.bubble.remove();
  customers.splice(customers.indexOf(cu),1);
}

/* =========================================================
   GHÉP BÁNH + GIAO BÁNH
   ========================================================= */
const currentEl=document.getElementById('current');
const ingCost = k => Math.ceil(ING[k].price*0.4*(has('tulanh')?0.7:1));
function renderCurrent(){
  currentEl.innerHTML = state.sandwich.length
    ? state.sandwich.map(k=>`<span title="${ING[k].name}">${ING[k].emoji}</span>`).join('')
    : `<span class="hint">Chạm nguyên liệu để kẹp bánh</span>`;
  for(const cu of customers) if(cu.st!=='leave') cu.bubble.querySelectorAll('.ord span').forEach(s=>s.classList.toggle('done', state.sandwich.includes(s.dataset.k)));
}
function addIngredient(key, silent){
  if(state.phase!=='play') return;
  if(state.sandwich.includes(key)){ if(!silent) toast(`Đã có ${ING[key].name} rồi`); return; }
  if(state.sandwich.length>=9){ toast('Bánh đầy rồi!'); return; }
  const cost=ingCost(key); state.money-=cost; state.stats.cost+=cost;
  const m=ingredientMesh(key, state.sandwich.length); bread.add(m); pop(m);
  state.sandwich.push(key); if(!silent) sfx.add(); renderCurrent(); updateHud();
}
const sameSet=(a,b)=> a.length===b.length && a.every(k=>b.includes(k));
const noSauce=a=>a.filter(k=>ING[k].type!=='sot');
function serve(cu){
  if(state.phase!=='play' || cu.st!=='wait') return;
  if(!state.sandwich.length){ toast('Kẹp bánh trước đã!'); return; }
  const open=cu.orders.map((o,i)=>i).filter(i=>!cu.served[i]);
  if(!open.length) { toast('Khách này đã đủ bánh, đợi bạn đồng hành nhé'); return; }
  // Ma nhỏ phụ việc: tự rưới sốt còn thiếu
  if(has('mano')){
    const i=open.find(i=>sameSet(noSauce(state.sandwich),noSauce(cu.orders[i])));
    if(i!==undefined) for(const k of cu.orders[i]) if(ING[k].type==='sot' && !state.sandwich.includes(k)) addIngredient(k,true);
  }
  const pos=screenPos(cu.mesh, cu.mesh.userData.top);
  const idx=open.find(i=>sameSet(state.sandwich, cu.orders[i]));
  if(idx===undefined && state.chao>0){
    state.chao--; resetBread(); updateHud(); sfx.gift();
    floatText('🥣 Cháo Lãng Quên: khách quên lỗi sai!', pos.x, pos.y, false, 'gift');
    return;
  }
  flySandwich(cu);
  if(idx!==undefined){
    cu.served[idx]=true;
    const price=priceOf(cu.orders[idx]);
    const frac=cu.pat.v/cu.pat.max;
    const rate= frac>0.6?0.5 : frac>0.3?0.2 : 0;
    const tip=Math.round(price*rate*cu.def.tip*(1+Math.min(state.combo,5)*0.1)*(has('loa')?1.3:1));
    state.money+=price+tip; state.stats.revenue+=price; state.stats.tips+=tip; state.stats.sold++;
    state.combo++;
    floatText(`+${price} 💰`, pos.x, pos.y-10);
    if(tip>0) setTimeout(()=>floatText(`Tip +${tip}`, pos.x, pos.y+14),180);
    sfx.ok(); setTimeout(sfx.coin,150);
    const done = cu.served.every(Boolean);
    if(!done){ cu.pat.v=Math.min(cu.pat.max, cu.pat.v+cu.pat.max*0.25); renderBubble(cu); renderCurrent(); }
    else if(cu.partner && cu.partner.st==='wait' && !cu.partner.served.every(Boolean)){ renderBubble(cu); }
    else {
      state.rep=Math.min(100, state.rep+(frac>0.6?5:3));
      if(cu.partner){ // cả đôi Vô Thường hài lòng
        const bonus=Math.round((priceOf(cu.orders[0])+priceOf(cu.partner.orders[0]))*0.5);
        state.money+=bonus; state.stats.tips+=bonus;
        setTimeout(()=>floatText(`Đôi Vô Thường thưởng +${bonus}`, pos.x, pos.y-40),400);
        cu.partner.jump=0.0001; leave(cu.partner,'happy');
      }
      if(cu.def.gift && frac>0.3){ // Mạnh Bà tặng cháo
        state.chao=Math.min(3,state.chao+1);
        setTimeout(()=>{ floatText('Mạnh Bà tặng 🥣 Cháo Lãng Quên', pos.x, pos.y-40, false, 'gift'); sfx.gift(); },450);
      }
      cu.jump=0.0001; leave(cu,'happy');
    }
  }else{
    state.rep=Math.max(0,state.rep-10); state.combo=0; state.stats.wrong++;
    floatText('Sai món! −10 😊', pos.x, pos.y, true); sfx.bad();
    cu.shake=0.5; leave(cu,'angry');
    if(cu.partner){ cu.partner.shake=0.5; leave(cu.partner,'angry'); }
  }
  resetBread(); updateHud();
  if(state.rep<=0) gameOver('rep');
}
const flying=[];
function flySandwich(cu){
  const g=bread; bread=null;
  const p=new THREE.Vector3(); g.getWorldPosition(p);
  sandwichRoot.remove(g); scene.add(g); g.position.copy(p); g.scale.copy(sandwichRoot.scale);
  flying.push({g, from:p, to:cu.mesh.position.clone().add(new THREE.Vector3(0,1.1,0.5)), t:0, s0:sandwichRoot.scale.x});
}

   GIAO DIỆN

const hud={money:document.getElementById('moneyV'), night:document.getElementById('nightV'), time:document.getElementById('timeV'),
  rep:document.getElementById('repFill'), combo:document.getElementById('combo'), chao:document.getElementById('chao'), chaoV:document.getElementById('chaoV')};
function updateHud(){
  hud.money.textContent=state.money;
  hud.money.parentElement.style.color = state.money<0?'var(--bad)':'var(--gold)';
  hud.night.textContent=`Đêm ${state.night}`;
  const t=Math.max(0,Math.ceil(state.timeLeft)); hud.time.textContent = state.closing?'Đóng cửa':`${Math.floor(t/60)}:${String(t%60).padStart(2,'0')}`;
  hud.rep.style.width=state.rep+'%';
  hud.rep.style.background= state.rep>50?'var(--good)': state.rep>25?'var(--warn)':'var(--bad)';
  hud.combo.style.opacity = state.combo>=2?1:0; hud.combo.textContent=`Combo x${state.combo} 🔥`;
  hud.chao.hidden = !state.chao; hud.chaoV.textContent=state.chao;
}
let freshIng=[];
function buildButtons(){
  document.querySelectorAll('.btns').forEach(el=>{
    const type=el.dataset.type; el.innerHTML='';
    for(const [k,d] of Object.entries(ING)){
      if(d.type!==type || !owned(k)) continue;
      const b=document.createElement('button'); b.className='ing'+(freshIng.includes(k)?' new':'');
      b.innerHTML=`<b>${d.emoji}</b><small>${d.name}</small>`; b.title=`${d.name} · bán ${d.price} vàng`;
      b.addEventListener('pointerdown',e=>{ e.preventDefault(); b.classList.add('press'); addIngredient(k); });
      ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>b.classList.remove('press')));
      el.appendChild(b);
    }
  });
}
document.getElementById('trash').addEventListener('click',()=>{
  if(state.phase!=='play'||!state.sandwich.length) return;
  sfx.trash(); resetBread(); state.combo=0; updateHud(); toast('Đã bỏ bánh, làm lại nhé');
});
const muteBtn=document.getElementById('mute');
function setMuteIcon(){ muteBtn.textContent=state.muted?'🔇':'🔊'; }
muteBtn.addEventListener('click',()=>{ state.muted=!state.muted; store.set('bmdn-muted',state.muted); setMuteIcon(); });
setMuteIcon();
let toastT=0; const toastEl=document.getElementById('toast');
function toast(msg){ toastEl.textContent=msg; toastEl.style.opacity=1; clearTimeout(toastT); toastT=setTimeout(()=>toastEl.style.opacity=0,1600); }
function floatText(txt,x,y,bad,cls=''){ const d=document.createElement('div'); d.className='float'+(bad?' bad':'')+(cls?' '+cls:''); d.textContent=txt; d.style.left=x+'px'; d.style.top=y+'px'; bubblesEl.appendChild(d); setTimeout(()=>d.remove(),1400); }
const tmpV=new THREE.Vector3();
function screenPos(obj, yOff){
  tmpV.set(0,yOff,0); obj.localToWorld(tmpV); tmpV.project(camera);
  return {x:(tmpV.x+1)/2*stageEl.clientWidth, y:(1-tmpV.y)/2*stageEl.clientHeight};
}
// Chạm trực tiếp vào khách để giao bánh
const ray=new THREE.Raycaster(), ndc=new THREE.Vector2();
canvas.addEventListener('pointerdown',e=>{
  if(state.phase!=='play') return;
  const r=canvas.getBoundingClientRect();
  ndc.set(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(ndc,camera);
  const waiting=customers.filter(c=>c.st==='wait');
  const hits=ray.intersectObjects(waiting.map(c=>c.mesh),true);
  if(hits.length){ const o=hits[0].object; const cu=waiting.find(c=>{ let p=o; while(p){ if(p===c.mesh) return true; p=p.parent; } return false; }); if(cu) serve(cu); }
});

function showCard(html, wide){ card.className='card'+(wide?' wide':''); card.innerHTML=html; overlay.classList.add('show'); card.scrollTop=0; }

function titleScreen(){
  state.phase='title';
  const save=store.get(SAVE), best=store.get(BEST)||0;
  showCard(`

function startNight(){

function endNight(){

function khanTexture(){
  if(checkerTex) return checkerTex;
  const cv=document.createElement('canvas'); cv.width=cv.height=32; const g=cv.getContext('2d');
  for(let y=0;y<4;y++) for(let x=0;x<4;x++){ g.fillStyle=(x+y)%2?'#f4efe6':'#2a2024'; g.fillRect(x*8,y*8,8,8); }
  checkerTex=new THREE.CanvasTexture(cv); checkerTex.colorSpace=THREE.SRGBColorSpace;
  checkerTex.wrapS=checkerTex.wrapT=THREE.RepeatWrapping; checkerTex.repeat.set(6,1); checkerTex.magFilter=THREE.NearestFilter;
  return checkerTex;
}

/* ---------- Khung xem 3D trong màn tạo nhân vật ---------- */
let preview=null;
function openPreview(canvasEl){
  closePreview();
  const r=new THREE.WebGLRenderer({canvas:canvasEl, antialias:true, alpha:true, preserveDrawingBuffer:true});
  r.setPixelRatio(Math.min(window.devicePixelRatio||1,2)); r.outputColorSpace=THREE.SRGBColorSpace;
  const sc=new THREE.Scene();
  sc.add(new THREE.HemisphereLight(0xffe4d6,0x40182a,1.35));
  const key=new THREE.DirectionalLight(0xffecd8,1.7); key.position.set(2,4,5); sc.add(key);
  const rim=new THREE.DirectionalLight(0xff6a2a,1.4); rim.position.set(-3,2,-4); sc.add(rim);
  const disc=part(new THREE.CylinderGeometry(0.85,0.9,0.1,32), 0x5a2438,{outline:0.03}); at(disc,0,-0.05,0); sc.add(disc);
  const cam=new THREE.PerspectiveCamera(30,1,0.1,50);
  const pv={r, sc, cam, model:null, yaw:0.5, spin:0.6, drag:null, raf:0, t:0, last:performance.now()};
  const fit=()=>{ const w=canvasEl.clientWidth||200, h=canvasEl.clientHeight||200; r.setSize(w,h,false); cam.aspect=w/h;
    const dist = 5.4/Math.min(1,cam.aspect*1.15); cam.position.set(0,1.3,dist); cam.lookAt(0,1.12,0); cam.updateProjectionMatrix(); };
  pv.fit=fit; fit();
  canvasEl.addEventListener('pointerdown',e=>{ pv.drag={x:e.clientX,yaw:pv.yaw}; pv.spin=0; canvasEl.setPointerCapture?.(e.pointerId); });
  canvasEl.addEventListener('pointermove',e=>{ if(pv.drag) pv.yaw=pv.drag.yaw+(e.clientX-pv.drag.x)*0.012; });
  const up=()=>{ if(pv.drag){ pv.drag=null; pv.spin=0.35; } };
  canvasEl.addEventListener('pointerup',up); canvasEl.addEventListener('pointercancel',up);
  const loop=now=>{ const dt=Math.min(0.05,(now-pv.last)/1000); pv.last=now; pv.t+=dt;
    if(!pv.drag) pv.yaw+=pv.spin*dt;
    if(pv.model){ pv.model.rotation.y=pv.yaw; pv.model.position.y=Math.abs(Math.sin(pv.t*2.2))*0.04; }
    r.render(sc,cam); pv.raf=requestAnimationFrame(loop); };
  pv.raf=requestAnimationFrame(loop);
  preview=pv; return pv;
}
function setPreviewModel(p){
  if(!preview) return;
  if(preview.model) preview.sc.remove(preview.model);
  preview.model=buildPlayer(p); preview.sc.add(preview.model); pop(preview.model);
}
function snapshotPortrait(p){
  // chụp ảnh chân dung (nửa người, nhìn thẳng) để dùng trên HUD và trong hoạt cảnh
  try{
    const cv=document.createElement('canvas'); cv.width=cv.height=192;
    const r=preview?.r; if(!r) return '';
    const m=buildPlayer(p); const sc=preview.sc; const old=preview.model; if(old) old.visible=false; sc.add(m);
    const cam=new THREE.PerspectiveCamera(30,1,0.1,50); cam.position.set(0.25,1.75,3.6); cam.lookAt(0,1.2,0);
    const size=r.getSize(new THREE.Vector2()), pr=r.getPixelRatio();
    r.setPixelRatio(1); r.setSize(192,192,false); r.render(sc,cam);
    const url=r.domElement.toDataURL('image/png');
    r.setPixelRatio(pr); r.setSize(size.x,size.y,false);
    sc.remove(m); if(old) old.visible=true; preview.fit();
    return url;
  }catch(e){ return ''; }
}
function closePreview(){
  if(!preview) return;
  cancelAnimationFrame(preview.raf);
  try{ preview.r.dispose(); preview.r.forceContextLoss(); }catch(e){}
  preview=null;
}

/* ---------- Áp dụng hồ sơ vào game: biển hiệu + HUD ---------- */
function signTexture(text){
  const w=768,h=128, cv=document.createElement('canvas'); cv.width=w; cv.height=h; const g=cv.getContext('2d');
  g.fillStyle='#d8301c'; g.fillRect(0,0,w,h); g.strokeStyle='#ffcf4a'; g.lineWidth=8; g.strokeRect(10,10,w-20,h-20);
  let fs=64; g.font=`800 ${fs}px "Baloo 2", sans-serif`;
  while(g.measureText(text).width>w-60 && fs>26){ fs-=2; g.font=`800 ${fs}px "Baloo 2", sans-serif`; }
  g.fillStyle='#fff6e4'; g.textAlign='center'; g.textBaseline='middle'; g.fillText(text,w/2,h/2+4);
  const t=new THREE.CanvasTexture(cv); t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=4; return t;
}
function applyPlayer(){
  if(cartSign && player?.name){
    const old=cartSign.material.map; cartSign.material.map=signTexture('BÁNH MỲ '+player.name.toLocaleUpperCase('vi')); cartSign.material.needsUpdate=true; old?.dispose();
  }
  const money=document.getElementById('money');
  let av=document.getElementById('meAv');
  if(player?.portrait){
    if(!av){ av=document.createElement('img'); av.id='meAv'; av.alt=''; money.prepend(av); }
    av.src=player.portrait; money.title=player.name;
    let nm=document.getElementById('meName'); if(!nm){ nm=document.createElement('span'); nm.id='meName'; av.after(nm); } nm.textContent=player.name+' ·';
  } else { av?.remove(); document.getElementById('meName')?.remove(); }
}
function savePlayer(p){ player=p; store.set(PLAYER_KEY,p); applyPlayer(); }

function openCreator({done, intro=false}={}){
  state.phase='intro';

  const swatches=(key,cols)=>cols.map((c,i)=>`<button class="sw" data-k="${key}" data-v="${i}" style="background:${plHex(c)}" aria-label="${key} ${i+1}"></button>`).join('');
  const chips=(key,list)=>list.map(([v,l])=>`<button class="chip" data-k="${key}" data-v="${v}">${l}</button>`).join('');
  showCard(`
    <h2>📜 Sổ Sinh Tử</h2>
    <p style="margin:0">${intro?'Phán Quan chấm bút lông, chờ bạn khai danh tính.':'Sửa lại tên và ngoại hình chủ xe.'}</p>
    <div class="cc">
      <div><canvas id="ccView"></canvas><div class="ccHint">Kéo để xoay nhân vật</div></div>
      <div>
        <div class="opt"><b>Tên chủ xe</b><div class="ccName"><input id="ccName" maxlength="16" autocomplete="off" enterkeyhint="done" placeholder="VD: ${plEsc(plPick(NAME_IDEAS))}" value="${plEsc(p.name)}"><button class="chip" id="ccDice" title="Gợi ý tên">🎲</button></div></div>
        <div class="opt"><b>Dáng người</b><div class="chips">${chips('body',PL.body)}</div></div>
        <div class="opt"><b>Màu da</b><div class="chips">${swatches('skin',PL.skin)}</div></div>
        <div class="opt"><b>Kiểu tóc</b><div class="chips">${chips('hair',PL.hair)}</div></div>
        <div class="opt"><b>Màu tóc</b><div class="chips">${swatches('hairColor',PL.hairColor)}</div></div>
        <div class="opt"><b>Trang phục</b><div class="chips">${chips('outfit',PL.outfit)}</div></div>
        <div class="opt"><b>Màu áo</b><div class="chips">${swatches('color',PL.color)}</div></div>
        <div class="opt"><b>Mũ nón</b><div class="chips">${chips('hat',PL.hat)}</div></div>
      </div>
    </div>
    <button class="big" id="ccOk">${intro?'Ghi vào sổ ✍️':'Lưu ✍️'}</button>
    <div class="navrow" style="justify-content:center;gap:18px"><button class="skip" id="ccRand">🎲 Ngẫu nhiên tất cả</button>${intro?'':'<button class="skip" id="ccBack">Quay lại</button>'}</div>`);
  card.classList.add('wide');
  const nameEl=document.getElementById('ccName');
  const refresh=()=>{
    card.querySelectorAll('[data-k]').forEach(b=>b.classList.toggle('on', String(p[b.dataset.k])===b.dataset.v));
    setPreviewModel(p);
  };
  card.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.k; p[k]= (k==='skin'||k==='hairColor'||k==='color') ? +b.dataset.v : b.dataset.v;
    if(k==='body' && b.dataset.v==='nu' && (p.hair==='dinh')) p.hair='duoi';
    sfx.add(); refresh();
  });
  nameEl.oninput=()=>{ p.name=nameEl.value; };
  nameEl.onkeydown=e=>{ if(e.key==='Enter') nameEl.blur(); };
  document.getElementById('ccDice').onclick=()=>{ nameEl.value=p.name=plPick(NAME_IDEAS.filter(n=>n!==p.name)); sfx.add(); };
  document.getElementById('ccRand').onclick=()=>{ Object.assign(p, randomProfile()); nameEl.value=p.name; sfx.bell(); refresh(); };
  const back=document.getElementById('ccBack'); if(back) back.onclick=()=>{ closePreview(); card.classList.remove('wide'); titleScreen(); };
  document.getElementById('ccOk').onclick=()=>{
    p.name=(nameEl.value||'').replace(/\s+/g,' ').trim().slice(0,16);
    if(!p.name){ p.name=plPick(NAME_IDEAS); nameEl.value=p.name; toast(`Chưa có tên, Phán Quan ghi đại là “${p.name}”`); }
    p.portrait=snapshotPortrait(p);
    savePlayer({...p});
    sfx.ok(); closePreview(); card.classList.remove('wide');
    done?.();
  };
  openPreview(document.getElementById('ccView'));
  refresh();
}
function ensurePlayer(next){ if(player?.name) next(); else openCreator({intro:true, done:next}); }

let storyTimer=0;
function playStory(pages, onDone, {skipTo}={}){
  state.phase='intro';
  let i=0, typing=false, full='';
  const finish=()=>{ clearInterval(storyTimer); typing=false; const s=document.getElementById('say'); if(s) s.textContent=full; };
  const end=()=>{ clearInterval(storyTimer); (skipTo||onDone)(); };
  const show=()=>{
    const pg=pages[i]; full=pg.text;
    showCard(`
      <div class="scene-art ${pg.bg}" id="art">${pg.art}</div>
      <div class="speaker">${pg.who}</div>
      <div class="say" id="say"></div>
      <div class="dots">${pages.map((_,k)=>`<i class="${k===i?'on':''}"></i>`).join('')}</div>
      <div class="navrow"><button class="big" id="stNext">${pg.btn||'Tiếp ▶'}</button><button class="skip" id="stSkip">Bỏ qua ⏭</button></div>`);
    if(pg.sfx) sfx[pg.sfx]();
    const say=document.getElementById('say'); let c=0; typing=true; const chars=[...full];
    clearInterval(storyTimer);
    storyTimer=setInterval(()=>{ c+=2; say.textContent=chars.slice(0,c).join(''); if(c>=chars.length) finish(); },28);
    const adv=()=>{ if(typing){ finish(); return; } if(++i<pages.length) show(); else { clearInterval(storyTimer); onDone(); } };
    document.getElementById('stNext').onclick=adv;
    say.onclick=adv; document.getElementById('art').onclick=adv;
    document.getElementById('stSkip').onclick=end;
  };
  show();
}
function beginNewGame(){
  const afterCreate=()=>playStory(STORY_B(), startNight);
  playStory(STORY_A(), ()=>openCreator({intro:true, done:afterCreate}),
    {skipTo:()=>openCreator({intro:true, done:startNight})});
}

/* =========================================================
   VÒNG LẶP CHÍNH
   ========================================================= */
function resize(){
  const w=stageEl.clientWidth, h=stageEl.clientHeight;
  if(!w||!h) return;
  renderer.setSize(w,h,false);
  const aspect=w/h; camera.aspect=aspect;
  // Khung hình luôn chứa đủ 3 chỗ khách; màn hẹp (điện thoại dọc) thì khách đứng sát nhau hơn
  slotScale = aspect<0.8 ? 0.62 : aspect<1.25 ? 0.8 : 1;
  const d=camera.position.z, W=8.8*slotScale;
  const needV = THREE.MathUtils.radToDeg(2*Math.atan((W/2/d)/aspect));
  const vfov = Math.min(80, Math.max(44, needV));
  camera.fov = vfov;
  // nghiêng camera để quầy bánh luôn nằm sát mép dưới khung hình
  const pitch = THREE.MathUtils.clamp(-34 + vfov/2, -12, 8);
  camTarget.set(0, camera.position.y + Math.tan(THREE.MathUtils.degToRad(pitch))*d, 0);
  camera.lookAt(camTarget);
  camera.updateProjectionMatrix();
  sandwichRoot.scale.setScalar(aspect<0.8 ? 0.72 : aspect<1.25 ? 0.85 : 1);
}
new ResizeObserver(resize).observe(stageEl);

const clock=new THREE.Clock(); let T=0, hudTimer=0;
const ease=t=>1-Math.pow(1-t,3);
function tick(){
  const dt=Math.min(clock.getDelta(),0.05); T+=dt;

  for(const l of lanterns){ l.rotation.z=Math.sin(T*1.5+l.parent.position.z+l.position.x)*0.08; }
  for(const w of wisps){ const u=w.userData; w.position.set(u.x+Math.sin(T*0.5+u.p)*1.2, u.y+Math.sin(T*1.3+u.p)*0.4, u.z+Math.cos(T*0.4+u.p)); }
  for(const p of papers){ const u=p.userData; u.y-=dt*u.s; if(u.y<0){ u.y=8; u.x=(Math.random()-.5)*16; }
    p.position.set(u.x+Math.sin(T+u.r)*0.6,u.y,u.z); p.rotation.set(T*1.3+u.r,T+u.r,0); }
  gate.userData.portal.material.color.setScalar(0.85+Math.sin(T*2)*0.15);
  gateLight.intensity=26+Math.sin(T*3)*6;
  for(const a of anims) a(T);

  for(let i=pops.length-1;i>=0;i--){ const p=pops[i]; p.t+=dt*5; p.obj.scale.setScalar(p.t<1? Math.max(0.01,ease(p.t)*1.12) : 1); if(p.t>=1) pops.splice(i,1); }
  for(let i=flying.length-1;i>=0;i--){ const f=flying[i]; f.t+=dt*3.5; const k=Math.min(1,f.t);
    f.g.position.lerpVectors(f.from,f.to,ease(k)); f.g.position.y+=Math.sin(k*Math.PI)*1.2; f.g.scale.setScalar(f.s0*(1-k*0.6)); f.g.rotation.y=k*2;
    if(k>=1){ scene.remove(f.g); flying.splice(i,1);} }

  if(state.phase==='play'){
    if(!state.closing){
      state.timeLeft-=dt; state.spawnT-=dt;
      if(state.spawnT<=0){ spawnCustomer(); state.spawnT=(Math.max(2.6, 7.2-state.night*0.6)+rnd(0,2.5))*(has('denlong')?0.75:1); }
      if(state.timeLeft<=0){ state.closing=true; state.closeT=2.2; toast('Hết giờ! Đóng cửa xe bánh mỳ'); for(const cu of customers) if(cu.st!=='leave') leave(cu,'closed'); }
    } else { state.closeT-=dt; if(state.closeT<=0) endNight(); }
    hudTimer-=dt; if(hudTimer<=0){ hudTimer=0.25; updateHud(); }
  }

  for(let i=customers.length-1;i>=0;i--){
    const cu=customers[i], m=cu.mesh; cu.t+=dt;
    if(!customers.includes(cu)) continue;
    const ud=m.userData, floaty=ud.float;
    ud.anim?.(cu.t);
    // chớp mắt
    cu.blinkT-=dt; const blinking = cu.blinkT<0;
    if(cu.blinkT<-0.13) cu.blinkT=rnd(2,5);
    ud.blink?.forEach(e=>e.scale.y=blinking?0.1:1);
    ud.arms?.forEach((a,j)=>a.rotation.x=Math.sin(cu.t*2.2+j)*0.18);
    if(cu.st==='walk'){
      cu.walkT+=dt/2.2; const k=Math.min(1,cu.walkT);
      m.position.lerpVectors(cu.from,new THREE.Vector3(cu.slot.x*cu.sx,0,cu.slot.z),ease(k));
      m.position.y=floaty?0.25+Math.sin(cu.t*3)*0.1:Math.abs(Math.sin(cu.t*9))*0.15;
      m.rotation.z=Math.sin(cu.t*9)*0.06;
      if(k>=1){ cu.st='wait'; m.rotation.z=0; sfx.bell(); renderCurrent(); }
    } else if(cu.st==='wait'){
      if(state.phase==='play' && !state.closing){
        if(!cu.partner || cu.type==='hac') cu.pat.v-=dt;   // đôi Vô Thường dùng chung một thanh kiên nhẫn
        if(cu.pat.v<=0){
          state.rep=Math.max(0,state.rep-8); state.combo=0; state.stats.left++;
          const p=screenPos(m,ud.top); floatText('Bỏ đi! −8 😊',p.x,p.y,true); sfx.bad();
          leave(cu,'gone'); if(cu.partner) leave(cu.partner,'gone');
          updateHud(); if(state.rep<=0) gameOver('rep'); continue;
        }
      }
      m.position.y=floaty?0.25+Math.sin(cu.t*2.5)*0.12:Math.max(0,Math.sin(cu.t*2.2))*0.03;
      m.scale.y=1+Math.sin(cu.t*2.2)*0.02;
      const frac=cu.pat.v/cu.pat.max;
      m.rotation.z = frac<0.3 ? Math.sin(cu.t*30)*0.03 : 0;
      cu.patEl.style.width=(frac*100)+'%';
      cu.patEl.style.background= frac>0.6?'var(--good)': frac>0.3?'var(--warn)':'var(--bad)';
    } else if(cu.st==='leave'){
      cu.walkT+=dt/1.6; const k=Math.min(1,cu.walkT);
      if(cu.jump!==undefined && cu.walkT<0.25){ m.position.y=Math.sin(cu.walkT*4*Math.PI)*0.5; }
      else { m.position.lerpVectors(cu.from,cu.to,k*k); m.position.y=Math.abs(Math.sin(cu.t*10))*0.15; }
      if(cu.shake>0){ cu.shake-=dt; m.rotation.z=Math.sin(cu.t*50)*0.12; } else m.rotation.z=0;
      m.rotation.y = cu.walkT>0.25 ? Math.sign(cu.to.x-cu.from.x)*Math.min(1,(cu.walkT-0.25)*4)*Math.PI/2 : 0;
      if(k>=1){ removeCustomer(cu); continue; }
    }
    const p=screenPos(m, ud.top+0.12);
    cu.bubble.style.transform=`translate(${p.x}px,${p.y}px) translate(-50%,-100%)`;
    if(cu.st==='wait') cu.bubble.style.opacity='1';
  }

  renderer.render(scene,camera);
  requestAnimationFrame(tick);
}
document.addEventListener('visibilitychange',()=>{ if(document.hidden) clock.getDelta(); });
if(new URLSearchParams(location.search).has('debug')) window.__bmdn = {state, customers, ING, UPG, CUST, spawn:spawnCustomer, refreshUpgrades, buildButtons}; // chỉ dùng khi kiểm thử

resize(); resetBread(); updateHud(); refreshUpgrades();
document.getElementById('loading').remove();
titleScreen();
requestAnimationFrame(tick);
</script>
