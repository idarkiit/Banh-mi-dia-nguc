<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1a0b14">
<title>Bánh Mỳ Cổng Địa Ngục</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1a0b14; --panel:#2a1220; --panel2:#3a1626; --line:#5a2438;
  --gold:#ffcf4a; --red:#e8452c; --ink:#fff6e6; --muted:#e0bfae;
  --good:#5fd36b; --warn:#ffc23a; --bad:#ff4b3e; --paper:#fff6e4; --paperInk:#2b1320;
  color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:'Baloo 2',system-ui,-apple-system,'Segoe UI',sans-serif;overflow:hidden;
  user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font-family:inherit;color:inherit;border:0;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#stage{position:relative;flex:1;min-height:0;overflow:hidden}
#c{display:block;width:100%;height:100%;touch-action:none}
#bubbles{position:absolute;inset:0;pointer-events:none;overflow:hidden}

/* HUD */
#hud{position:absolute;left:0;right:0;top:0;display:flex;align-items:flex-start;justify-content:space-between;gap:8px;
  padding:calc(8px + env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) 0 max(12px, env(safe-area-inset-left));pointer-events:none}
.hgrp{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pill{pointer-events:auto;background:rgba(26,8,18,.78);border:2px solid var(--line);border-radius:999px;
  padding:2px 12px;font-weight:800;font-size:17px;display:flex;align-items:center;gap:6px;white-space:nowrap;
  box-shadow:0 3px 0 rgba(0,0,0,.35)}
#money{color:var(--gold)}
#chao{color:#ffe6c4}
#nightBox{flex-direction:column;border-radius:14px;line-height:1.05;padding:4px 14px;text-align:center}
#nightBox small{font-size:12px;color:var(--muted);font-weight:700}
#repBar{width:min(28vw,140px);height:12px;border-radius:99px;background:#43192b;overflow:hidden;border:2px solid #1a0812}
#repFill{height:100%;width:70%;background:var(--good);transition:width .3s,background .3s}
#setBtn{font-size:16px;padding:2px 9px}
#combo{position:absolute;left:12px;top:calc(48px + env(safe-area-inset-top));font-weight:800;color:var(--gold);
  font-size:15px;text-shadow:0 2px 0 #000;opacity:0;transition:opacity .2s}

/* Bubbles */
.bubble{position:absolute;left:0;top:0;transform:translate(-50%,-100%);pointer-events:auto;cursor:pointer;
  background:var(--paper);color:var(--paperInk);border-radius:14px;padding:4px 7px 7px;border:3px solid #2b1320;
  box-shadow:0 4px 0 rgba(0,0,0,.35);min-width:64px;max-width:min(160px,31vw);text-align:center;transition:opacity .3s}
.bubble::after{content:"";position:absolute;left:50%;bottom:-11px;transform:translateX(-50%);
  border:8px solid transparent;border-top-color:#2b1320}
.bubble .who{font-size:11px;font-weight:800;line-height:1.1;color:#7a2a3a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bubble .ord{display:flex;flex-wrap:wrap;justify-content:center;gap:1px 3px;font-size:clamp(16px,4.2vw,22px);line-height:1.15}
.bubble .ord + .ord{border-top:2px dashed #e0c8b4;margin-top:3px;padding-top:3px}
.bubble .ord span.done{opacity:.3}
.bubble .ord.served{font-size:13px;font-weight:800;color:#2f8a3a}
.bubble .pat{height:6px;border-radius:9px;background:#e8d7c8;margin-top:4px;overflow:hidden}
.bubble .pat i{display:block;height:100%;width:100%;background:var(--good);border-radius:9px}
.bubble.pair{border-color:#5a2a6a}
.bubble.react{font-size:30px;padding:2px 10px;min-width:0}
.float{position:absolute;transform:translate(-50%,-50%);font-weight:800;font-size:20px;color:var(--gold);
  text-shadow:0 2px 0 #000,0 0 8px rgba(0,0,0,.6);pointer-events:none;white-space:nowrap;animation:floatUp 1.4s ease-out forwards}
.float.bad{color:var(--bad)} .float.gift{color:#b7f0ff}
@keyframes floatUp{from{opacity:1;margin-top:0}to{opacity:0;margin-top:-60px}}
#toast{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:rgba(26,8,18,.85);
  border:2px solid var(--line);padding:4px 14px;border-radius:999px;font-weight:700;font-size:15px;opacity:0;
  transition:opacity .25s;pointer-events:none;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis}

/* Panel */
#panel{flex:none;background:linear-gradient(var(--panel2),var(--panel));border-top:3px solid var(--line);
  padding:8px max(10px, env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));display:flex;gap:10px}
.rows{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.row{display:flex;align-items:center;gap:6px;min-width:0}
.rl{flex:none;width:34px;font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;line-height:1;text-align:center}
.btns{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 4px}
.btns::-webkit-scrollbar{display:none}
.ing{flex:none;width:58px;height:56px;border-radius:14px;background:var(--paper);color:var(--paperInk);
  display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 4px 0 #b88f78;
  transition:transform .08s}
.ing b{font-size:24px;line-height:1}
.ing small{font-size:10.5px;font-weight:700;line-height:1.1;margin-top:2px;white-space:nowrap}
.ing:active,.ing.press{transform:translateY(3px);box-shadow:0 1px 0 #b88f78}
.ing.new{outline:3px solid var(--gold)}
.side{flex:none;width:104px;display:flex;flex-direction:column;gap:6px}
#current{flex:1;min-height:56px;background:rgba(0,0,0,.25);border:2px dashed var(--line);border-radius:12px;
  display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:0 2px;font-size:19px;padding:4px}
#current .hint{font-size:11px;color:var(--muted);text-align:center;line-height:1.2}
#trash{background:#5a2438;border-radius:12px;padding:6px 4px;font-weight:800;font-size:13px;box-shadow:0 3px 0 #2a0f1a}
#trash:active{transform:translateY(2px);box-shadow:0 1px 0 #2a0f1a}

@media (max-width:480px){
  #hud{gap:4px}
  .pill{font-size:15px;padding:1px 9px}
  #repBar{width:16vw}
  #setBtn{padding:1px 7px;font-size:14px}
  .side{width:84px}
  .ing{width:54px;height:54px}
  .ing b{font-size:22px}
  .ing small{font-size:10px}
}
@media (orientation:landscape) and (max-height:540px){
  #app{flex-direction:row}
  #panel{width:min(40vw,340px);border-top:0;border-left:3px solid var(--line);flex-direction:column;overflow-y:auto}
  .btns{flex-wrap:wrap;overflow:visible}
  .ing{width:52px;height:50px}
  .ing b{font-size:21px}
  .side{width:auto;flex-direction:row}
  #current{min-height:44px}
  #trash{width:96px}
  #repBar{width:min(14vw,90px)}
  .pill{font-size:15px;padding:1px 10px}
}

/* Screens */
#overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
  padding:max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  background:radial-gradient(ellipse at center,rgba(60,10,30,.55),rgba(10,2,8,.88));z-index:10}
#overlay.show{display:flex}
.card{width:min(460px,100%);max-height:100%;overflow-y:auto;background:linear-gradient(#3a1626,#22101a);
  border:3px solid var(--line);border-radius:22px;padding:20px 20px 18px;text-align:center;box-shadow:0 10px 0 rgba(0,0,0,.4)}
.card.wide{width:min(640px,100%)}
.card h1{margin:0;font-size:clamp(28px,8vw,42px);line-height:1;color:var(--gold);text-shadow:0 3px 0 #8a1f12,0 0 18px rgba(255,90,40,.45);letter-spacing:.5px;text-wrap:balance}
.card h2{margin:0 0 6px;font-size:26px;color:var(--gold)}
.card h3{margin:14px 0 6px;font-size:16px;color:var(--ink);text-align:left;letter-spacing:.3px}
.card p{margin:8px 0;color:var(--muted);font-size:15px;line-height:1.35}
.how{text-align:left;background:rgba(0,0,0,.25);border-radius:14px;padding:8px 12px;margin:12px 0;font-size:14.5px;line-height:1.45}
.big{display:block;width:100%;margin-top:10px;background:var(--red);border-radius:16px;padding:10px;font-size:20px;font-weight:800;
  box-shadow:0 5px 0 #8a1f12}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 #8a1f12}
.big.alt{background:#5a2438;box-shadow:0 5px 0 #2a0f1a;font-size:17px}
table.sum{width:100%;border-collapse:collapse;margin:10px 0;font-size:15px;font-variant-numeric:tabular-nums}
table.sum td{padding:4px 2px;border-bottom:1px solid rgba(255,255,255,.08);text-align:left}
table.sum td:last-child{text-align:right;font-weight:800}
.pos{color:var(--good)} .neg{color:var(--bad)}
.stars{font-size:34px;letter-spacing:4px;margin:4px 0}
.note{background:rgba(255,207,74,.12);border:1px solid rgba(255,207,74,.35);border-radius:12px;padding:6px 10px;font-size:14px;color:var(--ink);margin-top:8px}
.warn{background:rgba(255,75,62,.15);border-color:rgba(255,75,62,.5)}
.story div{opacity:0;transform:translateY(6px);transition:all .5s;margin:8px 0;font-size:16px;color:var(--ink)}
.story div.on{opacity:1;transform:none}
.wallet{position:sticky;top:-20px;z-index:1;background:#2c1220;margin:-4px -6px 6px;padding:6px;border-radius:12px;font-weight:800;color:var(--gold);font-size:20px}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}
.item{background:rgba(0,0,0,.25);border:2px solid var(--line);border-radius:14px;padding:8px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.item.has{border-color:rgba(95,211,107,.5)}
.item b{font-size:28px;line-height:1.1}
.item .nm{font-weight:800;font-size:14.5px;line-height:1.15}
.item .ef{font-size:12.5px;color:var(--muted);line-height:1.25;flex:1}
.buy{margin-top:6px;width:100%;background:var(--gold);color:#2b1320;border-radius:10px;padding:4px;font-weight:800;font-size:14px;box-shadow:0 3px 0 #a07a1a}
.buy:disabled{opacity:.35;cursor:not-allowed}
.owned{margin-top:6px;color:var(--good);font-weight:800;font-size:14px}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--muted);z-index:20;background:var(--bg)}
@media (prefers-reduced-motion:reduce){ .float{animation-duration:.01s} .story div{transition:none} }

/* ===== MỞ ĐẦU: CỐT TRUYỆN + TẠO NHÂN VẬT ===== */
.card.wide{width:min(780px,100%)}
.scene-art{position:relative;height:clamp(110px,24vh,180px);border-radius:16px;margin:0 0 10px;overflow:hidden;
  display:flex;align-items:flex-end;justify-content:center;gap:2px;padding-bottom:12px;font-size:clamp(42px,11vw,66px);line-height:1;
  background:linear-gradient(#1c0820,#5a1424);border:2px solid var(--line);cursor:pointer}
.scene-art.city{background:linear-gradient(#0f1636,#3a2a5a 70%,#2a1a24)}
.scene-art.fog{background:linear-gradient(#3a2a3a,#8a6a7a)}
.scene-art.hell{background:radial-gradient(ellipse at 50% 100%,#ff8a2a,#a3121a 45%,#2a0610)}
.scene-art.court{background:linear-gradient(#2a0d10,#5a1a1a);}
.scene-art .bg{position:absolute;opacity:.35;font-size:1.9em;bottom:-6px}
.scene-art .sm{font-size:.62em}
.scene-art img.av{height:115%;max-height:150px;width:auto;margin-bottom:-12px;filter:drop-shadow(0 4px 0 rgba(0,0,0,.45))}
.scene-art .sil{filter:brightness(0) drop-shadow(0 0 6px #ff7a1a)}
.scene-art .bob{animation:bob 1.6s ease-in-out infinite}
.scene-art .shake{animation:shk .18s linear infinite}
.scene-art .zoom{animation:zoom .6s ease-out}
@keyframes bob{50%{transform:translateY(-8px)}}
@keyframes shk{25%{transform:translate(-3px,1px) rotate(-3deg)}75%{transform:translate(3px,-1px) rotate(3deg)}}
@keyframes zoom{from{transform:scale(.3);opacity:0}}
.speaker{font-weight:800;color:var(--gold);font-size:15px;text-align:left;min-height:1.2em}
.say{min-height:4.3em;text-align:left;font-size:17px;line-height:1.4;color:var(--ink);cursor:pointer}
.dots{display:flex;gap:6px;justify-content:center;margin-top:10px}
.dots i{width:8px;height:8px;border-radius:9px;background:var(--line)} .dots i.on{background:var(--gold)}
.navrow{display:flex;gap:10px;align-items:center}
.navrow .big{flex:1}
.skip{background:none;color:var(--muted);font-weight:700;font-size:14px;padding:12px 4px 0;white-space:nowrap;flex:none}
.cc{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;text-align:left;margin-top:8px}
.cc>div{min-width:0}
@media (min-width:640px){.cc{grid-template-columns:250px minmax(0,1fr);align-items:start}}
#ccView{display:block;width:100%;height:clamp(160px,32vh,290px);border-radius:16px;touch-action:none;cursor:grab;
  background:radial-gradient(ellipse at 50% 70%,#7a2438,#2a0d18 75%);border:2px solid var(--line)}
.ccHint{font-size:12px;color:var(--muted);text-align:center;margin-top:2px}
.opt{margin:0 0 8px}
.opt>b{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px}
.ccName{display:flex;gap:6px}
.ccName input{flex:1;min-width:0;font:inherit;font-size:18px;font-weight:700;padding:5px 12px;border-radius:12px;
  border:2px solid var(--line);background:var(--paper);color:var(--paperInk);outline:none;user-select:text;-webkit-user-select:text}
.ccName input:focus{border-color:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:rgba(0,0,0,.3);border:2px solid var(--line);border-radius:999px;padding:3px 11px;font-weight:700;font-size:14px}
.chip.on{border-color:var(--gold);color:var(--gold);background:rgba(255,207,74,.14)}
.sw{width:30px;height:30px;border-radius:50%;padding:0;border:3px solid rgba(0,0,0,.45);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.sw.on{border-color:var(--gold);transform:scale(1.12)}
.meline{display:flex;align-items:center;justify-content:center;gap:8px;margin:10px 0 0;color:var(--ink);font-weight:700}
.meline img{width:42px;height:42px;border-radius:50%;background:#43192b;border:2px solid var(--line)}
.linkbtn{background:none;color:var(--muted);text-decoration:underline;font-weight:700;font-size:14px;padding:4px}
#meAv{width:26px;height:26px;border-radius:50%;margin:0 2px 0 -8px;background:#43192b;object-fit:cover}
#meName{font-size:14px;color:var(--ink);margin-right:4px;max-width:9em;overflow:hidden;text-overflow:ellipsis}
@media (max-width:700px),(max-height:540px){#meName{display:none}}

/* ===== SỰ KIỆN: KHÁCH BÍ ẨN, MÀN ĐUỔI, HOẠT CẢNH, CÀI ĐẶT ===== */
.bubble.mystery{background:#2e1a4a;color:#ffe9a8;border-color:#ffcf4a}
.bubble.mystery .who{color:#ffcf4a}
.bubble.mystery::after{border-top-color:#ffcf4a}
#banner{position:absolute;left:50%;top:calc(62px + env(safe-area-inset-top));transform:translate(-50%,-10px);width:max-content;max-width:min(92%,520px);
  background:rgba(26,8,18,.94);border:3px solid var(--gold);border-radius:16px;padding:8px 14px;font-weight:800;font-size:16px;line-height:1.3;
  text-align:center;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;z-index:3}
#banner small{font-size:14px;font-weight:700;color:var(--ink)}
#banner.show{opacity:1;transform:translate(-50%,0)}
#banner.bad{border-color:var(--bad)}
#app.chasing #hud,#app.chasing #bubbles,#app.chasing #combo,#app.chasing #banner,
#app.cine #hud,#app.cine #bubbles,#app.cine #combo,#app.cine #toast,#app.cine #banner,
#app.chasing #panel,#app.cine #panel{display:none}
#chaseHud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:center;gap:6px;flex-wrap:wrap;
  padding:calc(8px + env(safe-area-inset-top)) 12px 0;pointer-events:none}
#chBar{width:min(30vw,170px);height:12px;border-radius:99px;background:#43192b;overflow:hidden;border:2px solid #1a0812}
#chFill{display:block;height:100%;width:60%;background:var(--good);transition:width .15s}
#chHint{position:absolute;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(26,8,18,.85);
  border:2px solid var(--line);border-radius:999px;padding:4px 14px;font-weight:700;font-size:15px;white-space:nowrap;pointer-events:none;transition:opacity .6s;max-width:94%;overflow:hidden;text-overflow:ellipsis}
#cuttop,#cutbar{position:fixed;left:0;right:0;background:#000;z-index:6}
#cuttop{top:0;height:calc(7vh + env(safe-area-inset-top))}
#cutbar{bottom:0;min-height:16vh;display:flex;align-items:center;justify-content:center;padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
#cutcap{font-size:clamp(16px,4.4vw,22px);font-weight:700;text-align:center;max-width:720px;line-height:1.35;color:var(--ink)}
#cutcap b{color:var(--gold)}
#cutcap.in{animation:capIn .5s ease-out}
@keyframes capIn{from{opacity:0;transform:translateY(8px)}}
#cutskip{position:absolute;right:max(10px,env(safe-area-inset-right));bottom:6px;background:rgba(255,255,255,.14);border-radius:999px;padding:3px 12px;font-weight:700;font-size:14px;color:var(--ink)}
.set{display:flex;flex-direction:column;gap:6px;margin:12px 0;text-align:left}
.srow{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;background:rgba(0,0,0,.25);border-radius:12px;padding:9px 12px;font-weight:700;font-size:16px;cursor:pointer}
.srow input[type=range]{flex:1;max-width:200px;accent-color:var(--gold);cursor:pointer}
.srow input[type=checkbox]{position:absolute;opacity:0;pointer-events:none}
.tgl{flex:none;width:48px;height:28px;border-radius:99px;background:#5a2438;position:relative;transition:background .2s}
.tgl::after{content:"";position:absolute;left:4px;top:4px;width:20px;height:20px;border-radius:50%;background:#fff6e4;transition:transform .2s}
input:checked + .tgl{background:var(--good)}
input:checked + .tgl::after{transform:translateX(20px)}
input:focus-visible + .tgl{outline:3px solid var(--gold);outline-offset:2px}
#takeBread{background:#8a5a1a;border-radius:12px;padding:6px 4px;font-weight:800;font-size:13px;box-shadow:0 3px 0 #3a2208;color:var(--ink)}
#takeBread.need{background:var(--gold);color:#3a1a0a;animation:needPulse 1s ease-in-out infinite}
#takeBread:active{transform:translateY(2px)}
@keyframes needPulse{50%{transform:scale(1.06);box-shadow:0 0 0 4px rgba(255,207,74,.35),0 3px 0 #8a5a12}}
.ii{width:1.3em;height:1.3em;object-fit:contain;vertical-align:middle;display:inline-block}
.ing b .ii{width:32px;height:32px}
.bubble .ord .ii{width:1.4em;height:1.4em}
#current .ii{width:26px;height:26px}
@media (orientation:landscape) and (max-height:540px){ .ing b .ii{width:28px;height:28px} #takeBread{width:96px} }
#cutbar.talk{min-height:22vh;flex-direction:column;align-items:center;gap:4px}
#cutbar.talk #cutcap{width:100%;max-width:760px;text-align:left}
#cutcap .spk{color:var(--gold);font-size:clamp(14px,3.6vw,18px);font-weight:800}
#cutcap .txt{font-weight:600;min-height:4em}
#cutnext{align-self:flex-end;margin-right:max(0px,calc((100% - 760px) / 2));background:var(--red);border-radius:999px;padding:5px 16px;font-weight:800;font-size:16px;color:#fff;box-shadow:0 3px 0 #8a1f12}
#cutnext:active{transform:translateY(2px);box-shadow:0 1px 0 #8a1f12}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:7}
#flash.on{animation:flashA .8s ease-out}
@keyframes flashA{0%{opacity:1}100%{opacity:0}}

/* =========================================================

const state = {
  phase:'title', night:1, money:START_MONEY, rep:70, debtNights:0, combo:0,
  owned:[...STARTER], upgrades:[], chao:0,
  timeLeft:NIGHT_LEN, spawnT:2, closing:false, closeT:0,

};

const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} },
};
const SAVE='bmdn-save-v2', BEST='bmdn-best';

/* =========================================================
   ÂM THANH (Web Audio, không cần file)
   ========================================================= */
const audioCfg = Object.assign({music:true, sfx:true, mv:0.6, sv:0.8}, store.get('bmdn-audio')||{});
const saveAudio = () => store.set('bmdn-audio', audioCfg);
let actx=null, sfxBus=null, musicBus=null, _noise=null;
function ac(){
  if(!actx){
    actx=new (window.AudioContext||window.webkitAudioContext)();
    sfxBus=actx.createGain(); sfxBus.connect(actx.destination);
    musicBus=actx.createGain(); musicBus.connect(actx.destination);
    sfxBus.gain.value=audioCfg.sfx?audioCfg.sv:0; musicBus.gain.value=audioCfg.music?audioCfg.mv*0.5:0;
  }
  if(actx.state==='suspended' && !document.hidden) actx.resume();
  return actx;
}
function applyAudio(){
  if(!actx) return; const t=actx.currentTime;
  sfxBus.gain.setTargetAtTime(audioCfg.sfx?audioCfg.sv:0,t,0.05);
  musicBus.gain.setTargetAtTime(audioCfg.music?audioCfg.mv*0.5:0,t,0.15);
}
function noiseBuffer(){
  if(!_noise){ _noise=actx.createBuffer(1,actx.sampleRate*2,actx.sampleRate); const d=_noise.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; }
  return _noise;
}
function tone(f, d=0.12, type='sine', v=0.12, slide=0, delay=0){
  if(!audioCfg.sfx) return;
  try{
    ac();
    const t0 = actx.currentTime + delay;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type=type; o.frequency.setValueAtTime(f,t0);
    if(slide) o.frequency.linearRampToValueAtTime(Math.max(30,f+slide), t0+d);
    g.gain.setValueAtTime(v,t0); g.gain.exponentialRampToValueAtTime(0.001,t0+d);
    o.connect(g).connect(sfxBus); o.start(t0); o.stop(t0+d+0.02);
  }catch(e){}
}
function noise(d=0.3, v=0.2, f=1200, {q=1, type='bandpass', f2=0, delay=0}={}){
  if(!audioCfg.sfx) return;
  try{
    ac(); const t=actx.currentTime+delay;
    const src=actx.createBufferSource(); src.buffer=noiseBuffer();
    const fl=actx.createBiquadFilter(); fl.type=type; fl.frequency.setValueAtTime(f,t); if(f2) fl.frequency.exponentialRampToValueAtTime(f2,t+d); fl.Q.value=q;
    const g=actx.createGain(); g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(0.001,t+d);
    src.connect(fl).connect(g).connect(sfxBus); src.start(t,Math.random()*1.5); src.stop(t+d+0.02);
  }catch(e){}
}
const sfx = {
  add(){ tone(520+Math.random()*120,.07,'triangle',.1); },
  ok(){ tone(880,.1,'sine',.12); tone(1320,.16,'sine',.12,0,.09); },
  coin(){ tone(1560,.08,'square',.05); tone(2090,.12,'square',.05,0,.07); },
  bad(){ tone(200,.3,'sawtooth',.08,-90); },
  bell(){ tone(1250,.25,'sine',.06); tone(1870,.2,'sine',.03,0,.02); },
  trash(){ tone(300,.15,'triangle',.1,-150); },
  gong(){ tone(110,1.2,'sine',.18,-20); tone(165,1,'triangle',.06); },
  buy(){ tone(660,.08,'square',.05); tone(990,.08,'square',.05,0,.08); tone(1320,.14,'square',.05,0,.16); },
  gift(){ [660,880,1100,1320].forEach((f,i)=>tone(f,.15,'sine',.08,0,i*.08)); },
  siren(){ for(let i=0;i<3;i++){ tone(880,.28,'square',.035,0,i*.6); tone(660,.28,'square',.035,0,i*.6+.3); } },
  hit(){ noise(.25,.35,400,{type:'lowpass'}); tone(120,.25,'sine',.2,-60); },
  splash(){ noise(.9,.3,3000,{type:'lowpass',f2:300}); noise(.5,.15,800,{q:.7,delay:.1}); },
  whoosh(){ noise(.18,.1,600,{q:.8,f2:2400}); },
  jump(){ tone(380,.18,'triangle',.08,420); },
  slap(){ noise(.12,.4,2500,{q:.6}); tone(180,.08,'square',.05); },
  poof(){ noise(.4,.2,1500,{q:.5,f2:400}); },
  reveal(){ [523,659,784,1047,1319].forEach((f,i)=>tone(f,.25,'triangle',.06,0,i*.07)); },
};

/* Nhạc nền ma quái: tự tổng hợp bằng Web Audio (không cần file)
   calm = đêm bán hàng, chase = màn bị đuổi, sad = hoạt cảnh phá sản */
const Music=(()=>{
  let want=null, cur=null, timer=0, nextT=0, step=0, drone=null, phrase=[0,5,7,8];
  const hz=s=>220*Math.pow(2,s/12);
  const SC=[0,1,5,7,8,10,12,13,15,17];          // âm giai u ám kiểu ngũ cung
  const BPM={calm:76, chase:152, sad:58};
  function voice(f,t,d,{type='triangle',v=0.08,bend=0,vib=0,attack=0.02}={}){
    const o=actx.createOscillator(), g=actx.createGain(); o.type=type;
    if(bend){ o.frequency.setValueAtTime(f*Math.pow(2,bend/12),t); o.frequency.exponentialRampToValueAtTime(f,t+Math.min(0.3,d*0.4)); }   // luyến kiểu đàn bầu
    else o.frequency.setValueAtTime(f,t);
    if(vib){ const l=actx.createOscillator(), lg=actx.createGain(); l.frequency.value=5; lg.gain.setValueAtTime(0,t); lg.gain.linearRampToValueAtTime(f*vib,t+d*0.6); l.connect(lg).connect(o.frequency); l.start(t); l.stop(t+d+0.05); }
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(v,t+attack); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g).connect(musicBus); o.start(t); o.stop(t+d+0.05);
  }
  function perc(t,{f=1800,q=6,d=0.05,v=0.12,type='bandpass'}={}){
    const s=actx.createBufferSource(); s.buffer=noiseBuffer(); const fl=actx.createBiquadFilter(); fl.type=type; fl.frequency.value=f; fl.Q.value=q;
    const g=actx.createGain(); g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    s.connect(fl).connect(g).connect(musicBus); s.start(t,Math.random()*1.5); s.stop(t+d+0.02);
  }
  const mo=(t,v)=>{ voice(1050,t,0.07,{type:'sine',v,attack:0.002}); voice(1580,t,0.04,{type:'sine',v:v*0.4,attack:0.002}); };   // mõ gỗ
  const bell=(t,v)=>[1,2.76,5.4].forEach((m,i)=>voice(392*m,t,3.2/(i+1),{type:'sine',v:v/(i+1),attack:0.005}));                // chuông chùa
  function kick(t,v){ const o=actx.createOscillator(), g=actx.createGain(); o.frequency.setValueAtTime(140,t); o.frequency.exponentialRampToValueAtTime(40,t+0.15);
    g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.2); o.connect(g).connect(musicBus); o.start(t); o.stop(t+0.22); }
  function startDrone(){
    const t=actx.currentTime, out=actx.createGain(); out.gain.setValueAtTime(0.0001,t); out.gain.exponentialRampToValueAtTime(1,t+2.5); out.connect(musicBus);
    const lp=actx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=380; lp.Q.value=5; lp.connect(out);
    const srcs=[];
    for(const [f,v] of [[55,0.07],[55.4,0.07],[82.4,0.04]]){ const o=actx.createOscillator(); o.type='sawtooth'; o.frequency.value=f; const g=actx.createGain(); g.gain.value=v; o.connect(g).connect(lp); o.start(); srcs.push(o); }
    const lfo=actx.createOscillator(); lfo.frequency.value=0.07; const lg=actx.createGain(); lg.gain.value=220; lfo.connect(lg).connect(lp.frequency); lfo.start(); srcs.push(lfo);
    // gió hú
    const w=actx.createBufferSource(); w.buffer=noiseBuffer(); w.loop=true; const bp=actx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=700; bp.Q.value=1.2;
    const wl=actx.createOscillator(); wl.frequency.value=0.11; const wlg=actx.createGain(); wlg.gain.value=450; wl.connect(wlg).connect(bp.frequency); wl.start(); srcs.push(wl);
    const wg=actx.createGain(); wg.gain.value=0.05; w.connect(bp).connect(wg).connect(out); w.start(); srcs.push(w);
    drone={out,srcs};
  }
  function stopDrone(){ if(!drone) return; const d=drone; drone=null; const t=actx.currentTime;
    d.out.gain.cancelScheduledValues(t); d.out.gain.setValueAtTime(Math.max(0.0001,d.out.gain.value),t); d.out.gain.exponentialRampToValueAtTime(0.0001,t+1);
    d.srcs.forEach(s=>{ try{ s.stop(t+1.1); }catch(e){} }); setTimeout(()=>d.out.disconnect(),1400); }
  function playStep(m,t,i){
    const sd=60/BPM[m]/2;
    if(m==='calm'){
      if(i%16===0) phrase=Array.from({length:4},()=>pick(SC.slice(0,8)));
      if(i%4===0 && Math.random()<0.7){ const s=phrase[(i/4|0)%4]; voice(hz(s),t,sd*5,{v:0.05,bend:Math.random()<0.5?-2:2,vib:0.012}); voice(hz(s),t+sd*3,sd*4,{v:0.016,vib:0.01}); }
      if(i%8===0) mo(t,0.06); if(i%8===3) mo(t,0.035); if(i%8===6 && Math.random()<0.5) mo(t,0.03);
      if(i%32===0) bell(t,0.04);
      if(i%64===40) voice(hz(29),t,2.2,{type:'sine',v:0.014,vib:0.03,bend:-5});   // tiếng hú cao văng vẳng
    } else if(m==='chase'){
      if(i%4===0) kick(t,0.22);
      if(i%8===4) perc(t,{f:1800,q:0.8,d:0.12,v:0.14});
      perc(t,{f:7000,q:1,d:0.03,v:i%2?0.03:0.05,type:'highpass'});
      voice(hz([0,0,12,0,1,0,12,7][i%8]-24),t,sd*0.9,{type:'sawtooth',v:0.07,attack:0.005});
      if(i%16===0) phrase=shuffle(SC).slice(0,8);
      if(i%2===0) voice(hz(phrase[(i/2|0)%phrase.length]),t,sd*1.6,{type:'square',v:0.022,attack:0.005});
      if(i%32===0) bell(t,0.03);
    } else {
      const mel=[12,10,8,7,8,5,1,0];
      if(i%4===0) voice(hz(mel[(i/4|0)%8]),t,sd*6,{type:'sine',v:0.06,bend:-1.5,vib:0.02});
      if(i%16===0) bell(t,0.03); if(i%8===0) mo(t,0.03);
    }
  }
  function sched(){ if(!cur||!actx) return; if(nextT<actx.currentTime) nextT=actx.currentTime+0.05;
    while(nextT<actx.currentTime+0.2){ playStep(cur,nextT,step); nextT+=60/BPM[cur]/2; step++; } }
  function start(m){ if(cur===m) return; cur=m; step=0; nextT=actx.currentTime+0.1; if(!drone) startDrone(); if(!timer) timer=setInterval(sched,50); }
  function stop(){ cur=null; clearInterval(timer); timer=0; stopDrone(); }
  return {
    play(m){ want=m; this.refresh(); },
    refresh(){ if(!actx) return; if(audioCfg.music && want) start(want); else stop(); },
    get mode(){ return cur; },
  };
})();

// Vật liệu hoạt hình (toon) + viền mực
const gradMap = (()=>{
  const d = new Uint8Array([60,140,210,255]);
  const t = new THREE.DataTexture(d,4,1,THREE.RedFormat);
  t.minFilter = t.magFilter = THREE.NearestFilter; t.needsUpdate = true; return t;
})();
const matCache = new Map();
function toon(color, emissive=0){
  const key = color+'|'+emissive;
  if(!matCache.has(key)) matCache.set(key, new THREE.MeshToonMaterial({color, gradientMap:gradMap, emissive}));
  return matCache.get(key);
}
const outlineMat = new THREE.MeshBasicMaterial({color:0x1a0810, side:THREE.BackSide});
function part(geo, color, {outline=0.05, emissive=0, shadow=true}={}){
  const m = new THREE.Mesh(geo, toon(color, emissive));
  m.castShadow = shadow; m.receiveShadow = true;
  if(outline){ const o = new THREE.Mesh(geo, outlineMat); o.scale.setScalar(1+outline); m.add(o); }
  return m;
}
const basic = (color, opts={}) => new THREE.MeshBasicMaterial({color, ...opts});
function at(obj,x,y,z){ obj.position.set(x,y,z); return obj; }
function rot(obj,x=0,y=0,z=0){ obj.rotation.set(x,y,z); return obj; }
function textTexture(text,{w=512,h=128,bg='#2a0d10',fg='#ffcf4a',font='800 72px "Baloo 2", sans-serif',border='#ffcf4a',vertical=false}={}){
  const cv=document.createElement('canvas'); cv.width=w; cv.height=h; const g=cv.getContext('2d');
  g.fillStyle=bg; g.fillRect(0,0,w,h);
  if(border){ g.strokeStyle=border; g.lineWidth=8; g.strokeRect(10,10,w-20,h-20); }
  g.fillStyle=fg; g.font=font; g.textAlign='center'; g.textBaseline='middle';
  if(vertical){ const ch=[...text]; ch.forEach((c,i)=>g.fillText(c,w/2,(i+0.5)*h/ch.length)); }
  else g.fillText(text,w/2,h/2+4);
  const t=new THREE.CanvasTexture(cv); t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=4; return t;
}
const tube = (pts, r, color, opts) => part(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts.map(p=>new THREE.Vector3(...p))), 24, r, 8), color, opts);

function eye(r, {iris=0x1a0a10, pupil=null}={}){
  const g=new THREE.Group();
  const w=part(new THREE.SphereGeometry(r,16,12),0xffffff,{outline:0.12}); w.scale.set(1,1.15,0.55); g.add(w);
  const ir=part(new THREE.SphereGeometry(r*0.64,14,10),iris,{outline:0,shadow:false}); ir.scale.set(1,1.1,0.5); at(ir,0,-r*0.08,r*0.36); g.add(ir);
  if(pupil!==null){ const p=part(new THREE.SphereGeometry(r*0.5,10,8),pupil,{outline:0,shadow:false}); p.scale.set(0.3,1.15,0.4); at(p,0,-r*0.08,r*0.48); g.add(p); }
  const s=new THREE.Mesh(new THREE.SphereGeometry(r*0.22,8,6),basic(0xffffff)); at(s,r*0.26,r*0.3,r*0.6); g.add(s);
  const s2=new THREE.Mesh(new THREE.SphereGeometry(r*0.1,6,5),basic(0xffffff)); at(s2,-r*0.2,-r*0.3,r*0.6); g.add(s2);
  return g;
}
function eyes(g,y,z,sp,r,opt){ const arr=[]; for(const s of [-1,1]){ const e=eye(r,opt); at(e,s*sp,y,z); g.add(e); arr.push(e); } (g.userData.blink ??= []).push(...arr); return arr; }

function smile(g,y,z,w,color=0x5a1020,th=0.022){ const m=part(new THREE.TorusGeometry(w,th,6,16,Math.PI),color,{outline:0}); rot(m,0,0,Math.PI); at(m,0,y,z); g.add(m); return m; }
function openMouth(g,y,z,r,{tongue=true}={}){ const m=part(new THREE.SphereGeometry(r,12,8),0x4a0a14,{outline:0.06}); m.scale.set(1.25,0.85,0.4); at(m,0,y,z); g.add(m);
  if(tongue){ const t=part(new THREE.SphereGeometry(r*0.6,10,6),0xff6f8a,{outline:0}); t.scale.set(1.2,0.6,0.5); at(t,0,y-r*0.4,z+r*0.15); g.add(t); } return m; }
function blush(g,y,z,sp,color=0xff8fa3){ for(const s of [-1,1]){ const b=new THREE.Mesh(new THREE.SphereGeometry(0.07,10,6),basic(color,{transparent:true,opacity:.75})); b.scale.set(1.3,0.6,0.3); at(b,s*sp,y,z); g.add(b); } }

function buildGhost(){
  const g=new THREE.Group(), c=0xf4f2ff;
  const prof=[[0.70,0.16],[0.66,0.35],[0.62,0.7],[0.6,1.1],[0.57,1.42],[0.45,1.66],[0.25,1.79],[0.001,1.83]];

const SLOTS = [{x:-2.6,z:1.4},{x:0,z:1.0},{x:2.6,z:1.4}].map(s=>({...s,busy:null}));
let slotScale = 1;
const customers=[];
const bubblesEl=document.getElementById('bubbles');
const rnd=(a,b)=>a+Math.random()*(b-a), pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a;};
const owned = k => state.owned.includes(k);

function makeSandwich(prefs){
  const n=state.night;
  let fills=Object.keys(ING).filter(k=>ING[k].type==='nhan'&&owned(k));
  let veg=Object.keys(ING).filter(k=>ING[k].type==='rau'&&owned(k));
  let sau=Object.keys(ING).filter(k=>ING[k].type==='sot'&&owned(k));
  if(prefs.noChili){ veg=veg.filter(k=>!CHILI.includes(k)); sau=sau.filter(k=>!CHILI.includes(k)); }
  // món mới mua được gọi nhiều hơn một chút
  const items=[ prefs.likes && owned(prefs.likes) && Math.random()<0.7 ? prefs.likes : pick([...fills, ...fills.filter(k=>ING[k].buy>0)]) ];
  const maxVeg=Math.min(veg.length, 1+Math.floor((n+1)/2));
  items.push(...shuffle(veg).slice(0,Math.floor(rnd(0,maxVeg+1))));
  items.push(...shuffle(sau).slice(0,Math.floor(rnd(0,(n>=2?2:1)+1))));
  if(prefs.wantsChili && !items.some(k=>CHILI.includes(k))) items.push('ot');
  return items;
}
function priceOf(order){ return order.reduce((s,k)=>s+ING[k].price,0) + (has('lo')?3:0); }
function patienceFor(def){ return Math.max(14, 30*def.patience*(1-0.05*(state.night-1))) * (has('chuong')?1.25:1); }

function createCustomer({type, def, name, build, prefs, slot, count=1, pat}){
  const mesh=build();
  mesh.position.set(slot.x*slotScale+rnd(-1.5,1.5)*0.5,0,-12.5); scene.add(mesh);
  const orders=Array.from({length:count},()=>makeSandwich(prefs));
  const cu={type, def, name, mesh, slot, sx:slotScale, orders, served:orders.map(()=>false), pat, st:'walk', t:Math.random()*10, blinkT:rnd(1,4), from:mesh.position.clone(), walkT:0};
  if(def.mystery) cu.secret = MYSTERY[urlQ.get('mystery')] ? urlQ.get('mystery') : pick(Object.keys(MYSTERY));
  slot.busy=cu; markSeen(type);
  const b=document.createElement('div'); b.className='bubble'; b.style.opacity='0';
  b.addEventListener('pointerdown',e=>{ e.stopPropagation(); serve(cu); });
  bubblesEl.appendChild(b); cu.bubble=b;
  renderBubble(cu);
  customers.push(cu);
  return cu;
}
function renderBubble(cu){
  const rows=cu.orders.map((o,i)=> cu.served[i]
    ? `<div class="ord served">✓ Xong ổ ${i+1}</div>`
    : `<div class="ord">${o.map(k=>`<span data-k="${k}" title="${ING[k].name}">${ingIcon(k)}</span>`).join('')}</div>`).join('');
  cu.bubble.className='bubble'+(cu.partner?' pair':'')+(cu.def.mystery?' mystery':'');
  cu.bubble.innerHTML=`<div class="who">${cu.partner?'🔗 ':''}${cu.def.mystery?'❓ ':''}${cu.name}${cu.orders.length>1?' · 2 ổ':''}</div>${rows}<div class="pat"><i></i></div>`;
  cu.patEl=cu.bubble.querySelector('.pat i');
}
function spawnCustomer(forced){
  const free=SLOTS.filter(s=>!s.busy);
  const types=Object.keys(CUST).filter(k=>CUST[k].night<=state.night);
  if(!free.length){ // quầy kín chỗ: khách mới xếp hàng chờ phía sau
    const q=QSLOTS.find(s=>!s.busy); if(forced || !q) return;
    const t=pick(types.filter(k=>!CUST[k].pair)), d=CUST[t];
    const pat={v:patienceFor(d)}; pat.max=pat.v;
    return createCustomer({type:t,def:d,name:d.name,build:d.build,prefs:d,slot:q,count:d.count||1,pat});
  }
  const newest=types.filter(k=>CUST[k].night===Math.min(state.night,4));
  let type = forced || (Math.random()<0.35 && newest.length ? pick(newest) : pick(types));
  // Hắc Bạch Vô Thường luôn đi cùng nhau: cần 2 chỗ liền kề
  if(CUST[type].pair){
    const pairs=[[0,1],[1,2]].filter(([a,b])=>!SLOTS[a].busy&&!SLOTS[b].busy);
    if(!pairs.length){ type=pick(types.filter(k=>!CUST[k].pair)); }
    else {
      const [a,b]=pick(pairs), def=CUST.vothuong;
      const pat={v:patienceFor(def)*1.3}; pat.max=pat.v;
      const hac=createCustomer({type:'hac',def,name:PAIR.hac.name,build:PAIR.hac.build,prefs:PAIR.hac,slot:SLOTS[a],pat});
      const bach=createCustomer({type:'bach',def,name:PAIR.bach.name,build:PAIR.bach.build,prefs:PAIR.bach,slot:SLOTS[b],pat});
      hac.partner=bach; bach.partner=hac; renderBubble(hac); renderBubble(bach);
      return hac;
    }
  }
  const def=CUST[type];
  const pat={v:patienceFor(def)}; pat.max=pat.v;
  return createCustomer({type,def,name:def.name,build:def.build,prefs:def,slot:pick(free),count:def.count||1,pat});
}
function leave(cu, mood){
  if(cu.st==='leave') return;
  cu.st='leave'; cu.mood=mood; cu.walkT=0; cu.from=cu.mesh.position.clone();
  cu.slot.busy=null;
  const side = cu.slot.x<0?-1: cu.slot.x>0?1 : (Math.random()<.5?-1:1);
  cu.to=new THREE.Vector3(side*13,0,cu.mesh.position.z-3);
  cu.bubble.className='bubble react'; cu.bubble.innerHTML = mood==='happy'?'😋':mood==='angry'?'😡':mood==='closed'?'😴':'💢';
  setTimeout(()=>{ cu.bubble.style.opacity='0'; },900);
}
function removeCustomer(cu){
  scene.remove(cu.mesh); cu.bubble.remove();
  customers.splice(customers.indexOf(cu),1);
}

const currentEl=document.getElementById('current');

function renderCurrent(){
  currentEl.innerHTML = state.sandwich.length
    ? state.sandwich.map(k=>`<span title="${ING[k].name}">${ingIcon(k)}</span>`).join('')
    : state.hasBread ? `<span class="hint">Chạm nguyên liệu để kẹp bánh</span>`
    : `<span class="hint">Bấm 🥖 Lấy vỏ bánh trước<br>(phím B)</span>`;
  for(const cu of customers) if(cu.st!=='leave') cu.bubble.querySelectorAll('.ord span').forEach(s=>s.classList.toggle('done', state.sandwich.includes(s.dataset.k)));
}
function addIngredient(key, silent){
  if(state.phase!=='play') return;
  if(!state.hasBread){ toast('Lấy vỏ bánh trước đã! 🥖'); takeBtn.classList.remove('need'); void takeBtn.offsetWidth; takeBtn.classList.add('need'); sfx.bad(); return; }
  if(state.sandwich.includes(key)){ if(!silent) toast(`Đã có ${ING[key].name} rồi`); return; }
  if(state.sandwich.length>=9){ toast('Bánh đầy rồi!'); return; }
  const cost=ingCost(key); state.money-=cost; state.stats.cost+=cost;
  const m=ingredientMesh(key, state.sandwich.length); bread.add(m); pop(m);
  state.sandwich.push(key); if(!silent) sfx.add(); renderCurrent(); updateHud();
}
const sameSet=(a,b)=> a.length===b.length && a.every(k=>b.includes(k));
const noSauce=a=>a.filter(k=>ING[k].type!=='sot');
function serve(cu){
  if(state.phase!=='play' || cu.st!=='wait') return;
  if(!state.sandwich.length){ toast(state.hasBread?'Kẹp nhân vào bánh trước đã!':'Lấy vỏ bánh rồi kẹp nhân trước đã! 🥖'); return; }
  const open=cu.orders.map((o,i)=>i).filter(i=>!cu.served[i]);
  if(!open.length) { toast('Khách này đã đủ bánh, đợi bạn đồng hành nhé'); return; }
  // Ma nhỏ phụ việc: tự rưới sốt còn thiếu
  if(has('mano')){
    const i=open.find(i=>sameSet(noSauce(state.sandwich),noSauce(cu.orders[i])));
    if(i!==undefined) for(const k of cu.orders[i]) if(ING[k].type==='sot' && !state.sandwich.includes(k)) addIngredient(k,true);
  }
  const pos=screenPos(cu.mesh, cu.mesh.userData.top);
  const idx=open.find(i=>sameSet(state.sandwich, cu.orders[i]));
  if(idx===undefined && state.chao>0){
    state.chao--; resetBread(); updateHud(); sfx.gift();
    floatText('🥣 Cháo Lãng Quên: khách quên lỗi sai!', pos.x, pos.y, false, 'gift');
    return;
  }
  flySandwich(cu);
  if(idx!==undefined){
    cu.served[idx]=true;
    const price=priceOf(cu.orders[idx]);
    const frac=cu.pat.v/cu.pat.max;
    const rate= frac>0.6?0.5 : frac>0.3?0.2 : 0;
    const tip=Math.round(price*rate*cu.def.tip*(1+Math.min(state.combo,5)*0.1)*(has('loa')?1.3:1));
    state.money+=price+tip; state.stats.revenue+=price; state.stats.tips+=tip; state.stats.sold++;
    state.combo++;
    floatText(`+${price} 💰`, pos.x, pos.y-10);
    if(tip>0) setTimeout(()=>floatText(`Tip +${tip}`, pos.x, pos.y+14),180);
    sfx.ok(); setTimeout(sfx.coin,150);
    const done = cu.served.every(Boolean);
    if(!done){ cu.pat.v=Math.min(cu.pat.max, cu.pat.v+cu.pat.max*0.25); renderBubble(cu); renderCurrent(); }
    else if(cu.partner && cu.partner.st==='wait' && !cu.partner.served.every(Boolean)){ renderBubble(cu); }
    else {
      state.rep=Math.min(100, state.rep+(frac>0.6?5:3));
      if(cu.partner){ // cả đôi Vô Thường hài lòng
        const bonus=Math.round((priceOf(cu.orders[0])+priceOf(cu.partner.orders[0]))*0.5);
        state.money+=bonus; state.stats.tips+=bonus;
        setTimeout(()=>floatText(`Đôi Vô Thường thưởng +${bonus}`, pos.x, pos.y-40),400);
        cu.partner.jump=0.0001; leave(cu.partner,'happy');
      }
      if(cu.def.gift && frac>0.3){ // Mạnh Bà tặng cháo
        state.chao=Math.min(3,state.chao+1);
        setTimeout(()=>{ floatText('Mạnh Bà tặng 🥣 Cháo Lãng Quên', pos.x, pos.y-40, false, 'gift'); sfx.gift(); },450);
      }
      if(cu.def.mystery) mysteryReveal(cu,true,frac);
      cu.jump=0.0001; leave(cu,'happy');
    }
  }else{
    state.rep=Math.max(0,state.rep-10); state.combo=0; state.stats.wrong++;
    floatText('Sai món! −10 😊', pos.x, pos.y, true); sfx.bad();
    if(cu.def.mystery) mysteryReveal(cu,false,0);
    cu.shake=0.5; leave(cu,'angry');
    if(cu.partner){ cu.partner.shake=0.5; leave(cu.partner,'angry'); }
  }
  resetBread(); updateHud();
  if(state.rep<=0) gameOver('rep');
}
const flying=[];
function flySandwich(cu){
  const g=bread; bread=null;
  const p=new THREE.Vector3(); g.getWorldPosition(p);
  sandwichRoot.remove(g); scene.add(g); g.position.copy(p); g.scale.copy(sandwichRoot.scale);
  flying.push({g, from:p, to:cu.mesh.position.clone().add(new THREE.Vector3(0,1.1,0.5)), t:0, s0:sandwichRoot.scale.x});
}

const tmpV=new THREE.Vector3();
function screenPos(obj, yOff){
  tmpV.set(0,yOff,0); obj.localToWorld(tmpV); tmpV.project(camera);

// Chạm trực tiếp vào khách để giao bánh
const ray=new THREE.Raycaster(), ndc=new THREE.Vector2();
canvas.addEventListener('pointerdown',e=>{
  if(state.phase!=='play') return;
  const r=canvas.getBoundingClientRect();
  ndc.set(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(ndc,camera);
  const waiting=customers.filter(c=>c.st==='wait');
  const hits=ray.intersectObjects(waiting.map(c=>c.mesh),true);
  if(hits.length){ const o=hits[0].object; const cu=waiting.find(c=>{ let p=o; while(p){ if(p===c.mesh) return true; p=p.parent; } return false; }); if(cu) serve(cu); }
});

function startNight(){
  sfx.gong();
  for(const cu of [...customers]) removeCustomer(cu);
  SLOTS.forEach(s=>s.busy=null); QSLOTS.forEach(s=>s.busy=null);
  Object.assign(state,{phase:'play', timeLeft:NIGHT_LEN, spawnT:1.5, closing:false, closeT:0, combo:0});
  state.stats=newStats();
  // sự kiện ngẫu nhiên trong đêm: Ngưu Đầu Mã Diện (chắc chắn có ở đêm 2) và khách bí ẩn
  const N=state.night;
  state.chaseAt = urlQ.has('chase') ? NIGHT_LEN-6 : (N===2 || (N>2 && Math.random()<0.4)) ? rnd(NIGHT_LEN*0.3,NIGHT_LEN*0.7) : -1;
  state.mysteryAt = urlQ.has('mystery') ? NIGHT_LEN-2 : Math.random()<(N===1?0.5:0.7) ? rnd(NIGHT_LEN*0.15,NIGHT_LEN*0.8) : -1;
  Music.play('calm');
  saveGame(); refreshUpgrades();
  buildButtons(); resetBread(); updateHud(); hideCard();
  toast(`Đêm ${state.night} bắt đầu! Cuối đêm trả ${rentFor(state.night)} vàng tiền thuê chỗ`);
}

let checkerTex = null;
function khanTexture(){
  if(checkerTex) return checkerTex;
  const cv=document.createElement('canvas'); cv.width=cv.height=32; const g=cv.getContext('2d');
  for(let y=0;y<4;y++) for(let x=0;x<4;x++){ g.fillStyle=(x+y)%2?'#f4efe6':'#2a2024'; g.fillRect(x*8,y*8,8,8); }
  checkerTex=new THREE.CanvasTexture(cv); checkerTex.colorSpace=THREE.SRGBColorSpace;
  checkerTex.wrapS=checkerTex.wrapT=THREE.RepeatWrapping; checkerTex.repeat.set(6,1); checkerTex.magFilter=THREE.NearestFilter;
  return checkerTex;
}

    for(const s of [-1,1]) g.add(at(part(new THREE.BoxGeometry(0.06,0.14,0.04), skin,{outline:0}), s*0.2,1.06,0.12));
  }
  // tay: tay áo theo kiểu áo
  const sleeve = p.outfit==='baba' ? 'long' : (p.outfit==='balo' ? 'none' : 'short');
  for(const s of [-1,1]){
    const arm=new THREE.Group(); at(arm, s*0.38,1.0,0); arm.rotation.z=s*0.32;
    if(s>0) arm.rotation.x=-0.7; // tay phải cầm ổ bánh mỳ
    arm.add(at(part(new THREE.CapsuleGeometry(0.085,0.3,4,8), sleeve==='long'?oc:skin), 0,-0.2,0));
    if(sleeve==='short') arm.add(at(part(new THREE.CylinderGeometry(0.11,0.12,0.16,10), shirt), 0,-0.06,0));
    const hand=part(new THREE.SphereGeometry(0.095,10,8), skin); at(hand,0,-0.42,0); arm.add(hand);
    if(s>0){ const b=part(new THREE.CapsuleGeometry(0.075,0.42,4,10), 0xe8a64a,{outline:0.07}); b.rotation.z=Math.PI/2; at(b,-0.05,-0.44,0.06); arm.add(b); }
    g.add(arm); (g.userData.limbs ??= []).push(arm);   // dùng cho hoạt cảnh (vẫy tay, chạy)
  }
  // đầu + tai + mặt
  g.add(at(part(new THREE.CylinderGeometry(0.1,0.12,0.12,10), skin), 0,1.1,0));
  g.add(at(part(new THREE.SphereGeometry(HR,22,16), skin), 0,HY,0));
  for(const s of [-1,1]) g.add(at(part(new THREE.SphereGeometry(0.08,10,8), skin), s*HR*0.98,HY,0));
  eyes(g, HY+0.03, HR*0.84, 0.155, 0.095);
  smile(g, HY-0.16, HR*0.93, 0.075, female?0xd0405a:0x5a1020);
  blush(g, HY-0.09, HR*0.88, 0.26);
  if(female) for(const s of [-1,1]){ const l=part(new THREE.BoxGeometry(0.07,0.022,0.02),0x111111,{outline:0}); at(l,s*0.25,HY+0.13,HR*0.86); l.rotation.z=-s*0.5; g.add(l); }
  brows(g, HY+0.2, HR*0.9, 0.155, female?-0.08:0.1, hc, female?0.1:0.13);

  // tóc
  const capGeo=(r,th)=>new THREE.SphereGeometry(r,22,12,0,Math.PI*2,0,th);
  const cap=part(capGeo(HR+0.025, p.hair==='dinh'?Math.PI*0.4:Math.PI*0.5), hc); at(cap,0,HY,0); cap.rotation.x=-0.28; g.add(cap);
  if(p.hair==='ngan'){
    for(const x of [-0.18,0,0.18]) g.add(at(part(new THREE.SphereGeometry(0.11,10,8), hc,{outline:0.04}), x,HY+0.3,0.27));
  } else if(p.hair==='xoan'){
    for(let i=0;i<12;i++){ const a=i/12*Math.PI*2; g.add(at(part(new THREE.SphereGeometry(0.12,10,8), hc,{outline:0.04}), Math.cos(a)*0.36,HY+0.2+Math.sin(i*1.7)*0.05,Math.sin(a)*0.36-0.04)); }
    g.add(at(part(new THREE.SphereGeometry(0.16,10,8), hc), 0,HY+0.42,0));
  } else if(p.hair==='bui'){
    g.add(at(part(new THREE.SphereGeometry(0.17,12,10), hc), 0,HY+0.42,-0.22));
    const pin=part(new THREE.CylinderGeometry(0.015,0.015,0.5,6), 0xffcf4a,{outline:0}); pin.rotation.z=1.2; at(pin,0,HY+0.44,-0.22); g.add(pin);
  } else if(p.hair==='duoi'){
    const t=part(new THREE.CapsuleGeometry(0.1,0.4,4,10), hc); at(t,0,HY-0.08,-0.47); t.rotation.x=0.35; g.add(t);
    g.add(at(part(new THREE.SphereGeometry(0.07,8,6), oc,{outline:0}), 0,HY+0.15,-0.42));
  } else if(p.hair==='dai'){
    const back=part(new THREE.CapsuleGeometry(0.36,0.42,6,14), hc); back.scale.z=0.55; at(back,0,HY-0.25,-0.18); g.add(back);
    for(const s of [-1,1]) g.add(at(part(new THREE.CapsuleGeometry(0.08,0.4,4,8), hc), s*0.38,HY-0.2,0.06));
  }
  // mũ
  const top=HY+HR;
  if(p.hat==='nonla'){
    const n=part(new THREE.ConeGeometry(0.88,0.46,28), 0xe8c27a); at(n,0,top+0.06,0); g.add(n);
    const ring=part(new THREE.TorusGeometry(0.62,0.015,4,28), 0xb88a3a,{outline:0}); ring.rotation.x=Math.PI/2; at(ring,0,top-0.02,0); g.add(ring);
  } else if(p.hat==='bep'){
    g.add(at(part(new THREE.CylinderGeometry(0.33,0.31,0.3,18), 0xffffff), 0,top-0.02,0));
    for(const [x,z] of [[0,0],[-0.16,0.06],[0.16,0.06],[0,-0.14]]){ const pf=part(new THREE.SphereGeometry(0.22,12,10), 0xffffff,{outline:0.04}); pf.scale.y=0.8; at(pf,x,top+0.22,z); g.add(pf); }
  } else if(p.hat==='baohiem'){
    const h=part(new THREE.SphereGeometry(HR+0.07,22,12,0,Math.PI*2,0,Math.PI*0.52), oc); at(h,0,HY+0.02,0); h.rotation.x=-0.18; g.add(h);
    g.add(at(part(new THREE.BoxGeometry(0.42,0.04,0.2), 0x222222,{outline:0.04}), 0,HY+0.26,HR+0.02));
    g.add(at(part(new THREE.BoxGeometry(0.06,0.3,0.03), 0xffffff,{outline:0}), 0,HY+0.4,0.12));
  } else if(p.hat==='khan'){
    const band=new THREE.Mesh(new THREE.TorusGeometry(HR+0.02,0.065,8,28), new THREE.MeshToonMaterial({map:khanTexture(), gradientMap:gradMap}));
    band.rotation.x=Math.PI/2-0.25; at(band,0,HY+0.2,0); g.add(band);
    for(const s of [-1,1]){ const t=part(new THREE.BoxGeometry(0.08,0.24,0.03), 0x2a2024,{outline:0.05}); at(t,s*0.08,HY+0.05,-HR-0.06); t.rotation.z=s*0.4; g.add(t); }
  }
  g.userData.top = p.hat==='bep'?2.45 : p.hat==='nonla'?2.2 : 2.05;
  return g;
}

/* ---------- Khung xem 3D trong màn tạo nhân vật ---------- */
let preview=null;
function openPreview(canvasEl){
  closePreview();
  const r=new THREE.WebGLRenderer({canvas:canvasEl, antialias:true, alpha:true, preserveDrawingBuffer:true});
  r.setPixelRatio(Math.min(window.devicePixelRatio||1,2)); r.outputColorSpace=THREE.SRGBColorSpace;
  const sc=new THREE.Scene();
  sc.add(new THREE.HemisphereLight(0xffe4d6,0x40182a,1.35));
  const key=new THREE.DirectionalLight(0xffecd8,1.7); key.position.set(2,4,5); sc.add(key);
  const rim=new THREE.DirectionalLight(0xff6a2a,1.4); rim.position.set(-3,2,-4); sc.add(rim);
  const disc=part(new THREE.CylinderGeometry(0.85,0.9,0.1,32), 0x5a2438,{outline:0.03}); at(disc,0,-0.05,0); sc.add(disc);
  const cam=new THREE.PerspectiveCamera(30,1,0.1,50);
  const pv={r, sc, cam, model:null, yaw:0.5, spin:0.6, drag:null, raf:0, t:0, last:performance.now()};
  const fit=()=>{ const w=canvasEl.clientWidth||200, h=canvasEl.clientHeight||200; r.setSize(w,h,false); cam.aspect=w/h;
    const dist = 5.4/Math.min(1,cam.aspect*1.15); cam.position.set(0,1.3,dist); cam.lookAt(0,1.12,0); cam.updateProjectionMatrix(); };
  pv.fit=fit; fit();
  canvasEl.addEventListener('pointerdown',e=>{ pv.drag={x:e.clientX,yaw:pv.yaw}; pv.spin=0; canvasEl.setPointerCapture?.(e.pointerId); });
  canvasEl.addEventListener('pointermove',e=>{ if(pv.drag) pv.yaw=pv.drag.yaw+(e.clientX-pv.drag.x)*0.012; });
  const up=()=>{ if(pv.drag){ pv.drag=null; pv.spin=0.35; } };
  canvasEl.addEventListener('pointerup',up); canvasEl.addEventListener('pointercancel',up);
  const loop=now=>{ const dt=Math.min(0.05,(now-pv.last)/1000); pv.last=now; pv.t+=dt;
    if(!pv.drag) pv.yaw+=pv.spin*dt;
    if(pv.model){ pv.model.rotation.y=pv.yaw; pv.model.position.y=Math.abs(Math.sin(pv.t*2.2))*0.04; }
    r.render(sc,cam); pv.raf=requestAnimationFrame(loop); };
  pv.raf=requestAnimationFrame(loop);
  preview=pv; return pv;
}
function setPreviewModel(p){
  if(!preview) return;
  if(preview.model) preview.sc.remove(preview.model);
  preview.model=buildPlayer(p); preview.sc.add(preview.model); pop(preview.model);
}
function snapshotPortrait(p){
  // chụp ảnh chân dung (nửa người, nhìn thẳng) để dùng trên HUD và trong hoạt cảnh
  try{
    const cv=document.createElement('canvas'); cv.width=cv.height=192;
    const r=preview?.r; if(!r) return '';
    const m=buildPlayer(p); const sc=preview.sc; const old=preview.model; if(old) old.visible=false; sc.add(m);
    const cam=new THREE.PerspectiveCamera(30,1,0.1,50); cam.position.set(0.25,1.75,3.6); cam.lookAt(0,1.2,0);
    const size=r.getSize(new THREE.Vector2()), pr=r.getPixelRatio();
    r.setPixelRatio(1); r.setSize(192,192,false); r.render(sc,cam);
    const url=r.domElement.toDataURL('image/png');
    r.setPixelRatio(pr); r.setSize(size.x,size.y,false);
    sc.remove(m); if(old) old.visible=true; preview.fit();
    return url;
  }catch(e){ return ''; }
}
function closePreview(){
  if(!preview) return;
  cancelAnimationFrame(preview.raf);
  try{ preview.r.dispose(); preview.r.forceContextLoss(); }catch(e){}
  preview=null;
}

/* ---------- Áp dụng hồ sơ vào game: biển hiệu + HUD ---------- */
function signTexture(text){
  const w=768,h=128, cv=document.createElement('canvas'); cv.width=w; cv.height=h; const g=cv.getContext('2d');
  g.fillStyle='#d8301c'; g.fillRect(0,0,w,h); g.strokeStyle='#ffcf4a'; g.lineWidth=8; g.strokeRect(10,10,w-20,h-20);
  let fs=64; g.font=`800 ${fs}px "Baloo 2", sans-serif`;
  while(g.measureText(text).width>w-60 && fs>26){ fs-=2; g.font=`800 ${fs}px "Baloo 2", sans-serif`; }
  g.fillStyle='#fff6e4'; g.textAlign='center'; g.textBaseline='middle'; g.fillText(text,w/2,h/2+4);
  const t=new THREE.CanvasTexture(cv); t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=4; return t;
}
function applyPlayer(){
  if(cartSign && player?.name){
    const old=cartSign.material.map; cartSign.material.map=signTexture('BÁNH MỲ '+player.name.toLocaleUpperCase('vi')); cartSign.material.needsUpdate=true; old?.dispose();
  }
  const money=document.getElementById('money');
  let av=document.getElementById('meAv');
  if(player?.portrait){
    if(!av){ av=document.createElement('img'); av.id='meAv'; av.alt=''; money.prepend(av); }
    av.src=player.portrait; money.title=player.name;
    let nm=document.getElementById('meName'); if(!nm){ nm=document.createElement('span'); nm.id='meName'; av.after(nm); } nm.textContent=player.name+' ·';
  } else { av?.remove(); document.getElementById('meName')?.remove(); }
}

let storyTimer=0;
function playStory(pages, onDone, {skipTo}={}){
  state.phase='intro';
  let i=0, typing=false, full='';
  const finish=()=>{ clearInterval(storyTimer); typing=false; const s=document.getElementById('say'); if(s) s.textContent=full; };
  const end=()=>{ clearInterval(storyTimer); (skipTo||onDone)(); };
  const show=()=>{
    const pg=pages[i]; full=pg.text;
    showCard(`
      <div class="scene-art ${pg.bg}" id="art">${pg.art}</div>
      <div class="speaker">${pg.who}</div>
      <div class="say" id="say"></div>
      <div class="dots">${pages.map((_,k)=>`<i class="${k===i?'on':''}"></i>`).join('')}</div>
      <div class="navrow"><button class="big" id="stNext">${pg.btn||'Tiếp ▶'}</button><button class="skip" id="stSkip">Bỏ qua ⏭</button></div>`);
    if(pg.sfx) sfx[pg.sfx]();
    const say=document.getElementById('say'); let c=0; typing=true; const chars=[...full];
    clearInterval(storyTimer);
    storyTimer=setInterval(()=>{ c+=2; say.textContent=chars.slice(0,c).join(''); if(c>=chars.length) finish(); },28);
    const adv=()=>{ if(typing){ finish(); return; } if(++i<pages.length) show(); else { clearInterval(storyTimer); onDone(); } };
    document.getElementById('stNext').onclick=adv;
    say.onclick=adv; document.getElementById('art').onclick=adv;
    document.getElementById('stSkip').onclick=end;
  };
  show();
}

const fxParts=[];
function burst(sc, pos, {color=0xffffff, n=14, speed=3, size=0.18, life=0.9, up=1.5, grav=-4}={}){
  const mat=basic(color,{transparent:true,opacity:0.9});
  const geo=new THREE.SphereGeometry(size,8,6);
  for(let i=0;i<n;i++){
    const m=new THREE.Mesh(geo,mat); m.position.copy(pos); m.scale.setScalar(rnd(0.6,1.3));
    const a=Math.random()*Math.PI*2, s=speed*rnd(0.3,1);
    fxParts.push({m, v:new THREE.Vector3(Math.cos(a)*s, up*rnd(0.5,1.5), Math.sin(a)*s), life, t:0, grav, s0:m.scale.x});
    sc.add(m);
  }
}
function fxUpdate(dt){
  for(let i=fxParts.length-1;i>=0;i--){ const p=fxParts[i]; p.t+=dt; p.v.y+=p.grav*dt; p.m.position.addScaledVector(p.v,dt);
    const k=p.t/p.life; p.m.scale.setScalar(p.s0*(1+k*0.8)); p.m.material.opacity=0.9*(1-k);
    if(k>=1){ p.m.removeFromParent(); fxParts.splice(i,1); } }
}
function label(text,{bg='#fff6e4',fg='#d8301c',w=512,h=160,font='800 88px "Baloo 2", sans-serif',border='#2b1320',scale=1.8}={}){
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:textTexture(text,{w,h,bg,fg,font,border}), depthTest:false}));
  sp.scale.set(scale, scale*h/w, 1); sp.renderOrder=10;
  const g=new THREE.Group(); g.add(sp); return g;
}
function gradBg(stops){
  const cv=document.createElement('canvas'); cv.width=4; cv.height=256; const g=cv.getContext('2d'); const gr=g.createLinearGradient(0,0,0,256);
  stops.forEach(([o,c])=>gr.addColorStop(o,c)); g.fillStyle=gr; g.fillRect(0,0,4,256);
  const t=new THREE.CanvasTexture(cv); t.colorSpace=THREE.SRGBColorSpace; return t;
}

const easeIO=k=>k<0.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
const bounce=k=>{ const n=7.5625,d=2.75; if(k<1/d) return n*k*k; if(k<2/d) return n*(k-=1.5/d)*k+0.75; if(k<2.5/d) return n*(k-=2.25/d)*k+0.9375; return n*(k-=2.625/d)*k+0.984375; };

function mysteryReveal(cu, ok, frac){

  const old=cu.mesh, nm=M.build(); nm.position.copy(old.position); scene.remove(old); scene.add(nm); cu.mesh=nm;
  burst(scene, nm.position.clone().add(new THREE.Vector3(0,1.3,0)), {color:0xd8b8ff, n:18, speed:2.4, size:0.22, grav:0.6, up:1});

    if(fast){ const b=50+n*10; state.money+=b; s.tips+=b; state.rep=Math.min(100,state.rep+15); msg=`Ngài khen bánh ngon! Thưởng <b>${b}</b> vàng, +15 😊`; }
    else if(ok){ state.rep=Math.min(100,state.rep+5); msg='Ngài gật gù: tạm được. +5 😊'; }
    else { state.rep=Math.max(0,state.rep-15); bad=true; msg='Ngài phật ý vì phục vụ kém! −15 😊'; }
  } else if(cu.secret==='thantai'){
    if(ok){ const b=fast?40+n*15:20+n*5; state.money+=b; s.tips+=b; msg=`Lì xì <b>${b}</b> vàng 🧧 Buôn may bán đắt!`; }
    else { bad=true; msg='Thần Tài lặng lẽ bỏ đi… mất lộc rồi!'; }
  } else {
    if(fast){ state.rep=Math.min(100,state.rep+20); msg='Xe sạch, bánh chuẩn! Tặng giấy khen, +20 😊'; }
    else if(ok){ msg='Đạt yêu cầu. Lần sau nhanh tay hơn nhé!'; }
    else { const f=25+n*5; state.money-=f; s.fine+=f; bad=true; msg=`Vi phạm vệ sinh! Phạt <b>${f}</b> vàng`; }
  }
  s.mystery.push(M.title);
  banner(`❓ Khách bí ẩn là <b>${M.title}</b>!<br><small>${msg}</small>`, bad);
  updateHud();
}

function chaseMove(d){ if(state.phase!=='chase'||C.intro>0) return; const l=THREE.MathUtils.clamp(C.lane+d,0,2); if(l!==C.lane){ C.lane=l; sfx.whoosh(); } }
function chaseJump(){ if(state.phase!=='chase'||C.intro>0) return; if(C.y<=0.01){ C.vy=8.2; sfx.jump(); } }
window.addEventListener('keydown',e=>{
  if(state.phase!=='chase') return;
  const k=e.key;
  if(k==='ArrowLeft'||k==='a'||k==='A'){ chaseMove(-1); e.preventDefault(); }
  else if(k==='ArrowRight'||k==='d'||k==='D'){ chaseMove(1); e.preventDefault(); }
  else if(k==='ArrowUp'||k===' '||k==='w'||k==='W'){ chaseJump(); e.preventDefault(); }
});
let swipe=null;
canvas.addEventListener('pointerdown',e=>{ if(state.phase==='chase') swipe={x:e.clientX,y:e.clientY,done:false}; });
canvas.addEventListener('pointermove',e=>{
  if(!swipe||swipe.done||state.phase!=='chase') return;
  const dx=e.clientX-swipe.x, dy=e.clientY-swipe.y;
  if(Math.hypot(dx,dy)>26){ swipe.done=true; if(Math.abs(dx)>Math.abs(dy)) chaseMove(Math.sign(dx)); else if(dy<0) chaseJump(); }
});
canvas.addEventListener('pointerup',e=>{
  if(!swipe||state.phase!=='chase'){ swipe=null; return; }
  if(!swipe.done){ const r=canvas.getBoundingClientRect(), fx=(e.clientX-r.left)/r.width; if(fx<0.34) chaseMove(-1); else if(fx>0.66) chaseMove(1); else chaseJump(); }
  swipe=null;
});
function updChaseHud(){

function endChase(escaped){

const camA=new THREE.Vector3(), camB=new THREE.Vector3(), lookA=new THREE.Vector3(), lookB=new THREE.Vector3();
function chaseUpdate(dt){
  C.t+=dt;
  if(state.phase==='chase'){
    if(C.intro>0){ C.intro-=dt; C.camK=THREE.MathUtils.clamp(1-C.intro/C.introLen,0,1); C.speed=C.base*C.camK; }
    else {
      C.left-=dt; C.speed=Math.min(C.max,C.speed+dt*0.3); C.dist=Math.min(C.maxDist,C.dist+dt*0.07);
      C.spawn-=dt;
      if(C.spawn<=0 && C.left>2.2){
        C.spawn=rnd(0.85,1.2)*(15/C.speed);
        const two=Math.random()<0.3+0.35*(1-C.left/CHASE_LEN);
        const ln=shuffle([0,1,2]), n=two?2:1;
        for(let j=0;j<n;j++) addObs(pick(['mo','mo','vac','vac','ma']), ln[j], -70);
        if(Math.random()<0.75) for(let j=0;j<3;j++) addObs('coin', ln[2], -70-1.7*j);
      }
      if(C.left<=0) endChase(true);
    }
    C.chZ+=((1.4+C.dist*1.25)-C.chZ)*Math.min(1,dt*3);
  } else {
    C.endT+=dt; C.camK=Math.max(0,1-C.endT/1.3);
    if(C.result==='escape'){ C.speed=Math.max(C.base*0.6,C.speed-dt*5); C.chZ+=dt*(4+C.endT*6); }
    else { C.speed=Math.max(0,C.speed-dt*28); C.chZ=Math.max(0.9,C.chZ-dt*5); }
    if(C.endT>2.4 && !C.shown){ C.shown=true; chaseResult(); }
  }
  const v=C.speed*dt;
  for(const s of CH.segs){ s.position.z+=v; if(s.position.z>SEG*1.5) s.position.z-=NSEG*SEG; }
  // người chạy
  C.x+=(LANES[C.lane]-C.x)*Math.min(1,dt*14);
  if(C.y>0||C.vy>0){ C.vy-=26*dt; C.y=Math.max(0,C.y+C.vy*dt); if(C.y===0) C.vy=0; }
  const running=C.speed>1;
  CH.runner.position.set(C.x, C.y+(running&&C.y===0?Math.abs(Math.sin(C.t*13))*0.12:0), 0);
  CH.runner.rotation.z=(C.x-LANES[C.lane])*0.12;
  CH.runner.rotation.x=C.y>0?0.15:0;
  if(C.inv>0){ C.inv-=dt; CH.runner.visible=Math.floor(C.inv*12)%2===0; } else CH.runner.visible=true;
  const L=CH.model.userData.limbs;
  if(L){ L[0].rotation.x=running?Math.sin(C.t*13)*0.9:0; L[1].rotation.x=-1.3; }
  CH.wheels.forEach(w=>w.rotation.y+=v/0.27);
  // chướng ngại vật + vàng
  const active=state.phase==='chase'&&C.intro<=0;
  for(let i=CH.obs.length-1;i>=0;i--){
    const o=CH.obs[i], m=o.mesh; m.position.z+=v;
    if(o.type==='coin'){ m.rotation.y+=dt*4; m.position.y=0.75+Math.sin(C.t*4+o.ph)*0.1; }
    else if(o.type==='ma' && !o.hit){ m.position.y=0.15+Math.sin(C.t*3+o.ph)*0.15; m.position.x=LANES[o.lane]+Math.sin(C.t*2+o.ph)*0.25; }
    if(o.hit && o.fly){ m.position.addScaledVector(o.fly,dt); o.fly.y-=20*dt; m.rotation.x+=dt*8; }
    else if(o.hit && o.type==='coin'){ m.position.y+=dt*4; m.scale.multiplyScalar(1-dt*4); }
    const z=m.position.z;
    if(active && !o.hit && z>-1.65 && z<0.45 && Math.abs(m.position.x-C.x)<0.95){
      if(o.type==='coin'){ o.hit=true; C.coins++; sfx.coin(); }
      else if(o.type==='vac' && C.y>0.45){ /* nhảy qua */ }
      else {
        o.hit=true; o.fly=new THREE.Vector3((m.position.x>=C.x?1:-1)*5,7,-3);
        C.dist-=1.2*(has('xemay')?0.7:1); C.inv=1.0; C.shake=0.35; sfx.hit();
        burst(CH.sc,new THREE.Vector3(C.x,1,-0.6),{color:0xffe0a0,n:10,speed:3,size:0.15,life:0.6});
        if(C.dist<=0){ C.dist=0; endChase(false); }
      }
    }
    if(z>12 || m.position.y<-6){ m.removeFromParent(); CH.obs.splice(i,1); }
  }
  // hai sai nha đuổi theo
  CH.chasers.forEach((c,i)=>{
    const off=[-1,1][i];
    c.position.x+=((C.x+off)-c.position.x)*Math.min(1,dt*2.5);
    c.position.z=C.chZ+(i?0.35:0);
    const tired=state.phase==='chaseEnd'&&C.result==='escape'&&C.endT>0.8;
    c.position.y=running&&!tired?Math.abs(Math.sin(C.t*11+i*1.5))*0.25:0;
    c.rotation.z=running&&!tired?Math.sin(C.t*11+i*1.5)*0.08:0;
    c.rotation.x=tired?-0.35:0;
    const cl=c.userData.limbs; if(cl){ cl[0].rotation.x=running?Math.sin(C.t*11+i)*0.9:0; cl[1].rotation.x=state.phase==='chaseEnd'&&C.result==='caught'?-2.4:(running?-Math.sin(C.t*11+i)*0.9:0); }
  });
  // máy quay: phía trước (thấy mặt) <-> phía sau (lúc chạy)
  const k=easeIO(C.camK), bx=C.x*0.45;
  camA.set(C.x+2.4,2.5,-6.4); lookA.set(C.x,1.3,1.8);
  camB.set(bx,5.4,8.8); lookB.set(bx,0.9,-6);
  chaseCam.position.lerpVectors(camA,camB,k);
  chaseCam.position.y+=Math.sin(k*Math.PI)*2.6; chaseCam.position.x+=Math.sin(k*Math.PI)*3.5;
  if(C.shake>0){ C.shake-=dt; chaseCam.position.x+=rnd(-1,1)*C.shake*0.6; chaseCam.position.y+=rnd(-1,1)*C.shake*0.6; }
  lookA.lerp(lookB,k); chaseCam.lookAt(lookA);
  C.hudT-=dt; if(C.hudT<=0){ C.hudT=0.1; updChaseHud(); }
}
function chaseResult(){
  const s=state.stats;
  if(C.result==='escape'){
    state.money+=C.coins; s.tips+=C.coins; s.chase={ok:true, v:C.coins};
    showCard(`
      <h2>Thoát rồi! 🎉</h2>
      <div class="scene-art hell"><span class="bob">${avImg()}</span><span class="sm">🛒💨</span><span class="sm" style="opacity:.6">🐮😮‍💨 🐴😮‍💨</span></div>

const cutTop=document.getElementById('cuttop'), cutBar=document.getElementById('cutbar'), cutCap=document.getElementById('cutcap');
let CUT=null;
document.getElementById('cutskip').addEventListener('click',e=>{ e.stopPropagation(); finishCut(true,true); });
function playCutscene(shots, done, {music, temp=[], cleanup, onSkip}={}){
  if(CUT) finishCut(false);
  temp.forEach(([p,o])=>p.add(o));
  CUT={shots, i:-1, t:0, done, temp, cleanup, onSkip, cap2:false, a:new THREE.Vector3(), b:new THREE.Vector3(), la:new THREE.Vector3(), lb:new THREE.Vector3(), l:new THREE.Vector3()};
  appEl.classList.add('cine'); cutTop.hidden=false; cutBar.hidden=false;
  if(music) Music.play(music);
  nextShot();
}
function setCap(html){ cutCap.innerHTML=html||''; cutCap.classList.remove('in'); void cutCap.offsetWidth; cutCap.classList.add('in'); }
function nextShot(){
  CUT.i++; const s=CUT.shots[CUT.i];
  if(!s){ finishCut(); return; }
  CUT.t=0; CUT.cap2=false;
  CUT.a.set(...s.cam.from); CUT.b.set(...s.cam.to); CUT.la.set(...s.cam.look); CUT.lb.set(...(s.cam.look2||s.cam.look));
  s.setup?.();
  if(s.say){ // lời thoại: chữ chạy dần, chạm để đi tiếp
    CUT.typing=true; CUT.sayN=0; cutBar.classList.add('talk');
    setCap(`<div class="spk">${s.say.who||''}</div><div class="txt"></div>`);
    cutNext.hidden=false; cutNext.textContent=s.say.btn||'Tiếp ▶';
    if(s.say.sfx) sfx[s.say.sfx]?.();
  } else { cutBar.classList.remove('talk'); cutNext.hidden=true; setCap(s.caption); }
}
function cutUpdate(dt){
  const s=CUT.shots[CUT.i]; CUT.t+=dt;
  const k=Math.min(1,CUT.t/s.dur), e=easeIO(k);
  cutCam.position.lerpVectors(CUT.a,CUT.b,e); CUT.l.lerpVectors(CUT.la,CUT.lb,e); cutCam.lookAt(CUT.l);
  s.update?.(CUT.t,k,dt);
  if(!CUT) return;
  if(s.caption2 && !CUT.cap2 && k>=(s.at??0.55)){ CUT.cap2=true; setCap(s.caption2); }
  if(s.say){
    if(CUT.typing){ const ch=[...s.say.text]; CUT.sayN=Math.min(ch.length,CUT.sayN+dt*48);
      cutCap.querySelector('.txt').textContent=ch.slice(0,Math.floor(CUT.sayN)).join('');
      if(CUT.sayN>=ch.length) CUT.typing=false; }
    return; // giữ cảnh cho tới khi người chơi chạm
  }
  if(CUT.t>=s.dur) nextShot();
}
function finishCut(run=true, skipped=false){
  const c=CUT; if(!c) return; CUT=null;
  c.temp.forEach(([p,o])=>o.removeFromParent());
  c.cleanup?.();
  appEl.classList.remove('cine'); cutTop.hidden=true; cutBar.hidden=true; cutBar.classList.remove('talk'); cutNext.hidden=true;
  if(run) (skipped && c.onSkip ? c.onSkip : c.done)?.();
}

function gameOver(cause){
  if(state.phase==='over') return;
  state.phase='over';
  store.del(SAVE);

/* ---------- Chụp ảnh 3D thành icon / chân dung ---------- */
function withSnapper(size, fn){
  const cv=document.createElement('canvas'); cv.width=cv.height=size;
  let r=null;
  try{
    r=new THREE.WebGLRenderer({canvas:cv, antialias:true, alpha:true, preserveDrawingBuffer:true});
    r.outputColorSpace=THREE.SRGBColorSpace; r.setPixelRatio(1); r.setSize(size,size,false); r.setClearColor(0x000000,0);
    const sc=new THREE.Scene(); lightUp(sc,0xfff2e6,0x6a4a50);
    fn((obj,cam)=>{ sc.add(obj); r.render(sc,cam); const url=cv.toDataURL('image/png'); sc.remove(obj); return url; });
  }catch(e){ console.warn('snapper',e); }
  finally{ try{ r?.dispose(); r?.forceContextLoss(); }catch(e){} }
}
function fitOrtho(obj, dir){
  const box=new THREE.Box3().setFromObject(obj), c=box.getCenter(new THREE.Vector3()), s=box.getSize(new THREE.Vector3());
  const half=Math.max(s.x,s.y,s.z)*0.62;
  const cam=new THREE.OrthographicCamera(-half,half,half,-half,0.01,50);
  cam.position.copy(c).addScaledVector(dir.clone().normalize(),10); cam.lookAt(c); return cam;
}
function bottleMesh(color){
  const g=new THREE.Group();
  g.add(at(part(new THREE.CylinderGeometry(0.16,0.19,0.62,16),color,{outline:0.05}),0,0.31,0));
  g.add(at(part(new THREE.CylinderGeometry(0.1,0.16,0.14,16),color,{outline:0.05}),0,0.68,0));
  g.add(at(part(new THREE.ConeGeometry(0.07,0.24,12),0xffffff,{outline:0.06}),0,0.86,0));
  const lb=new THREE.Mesh(new THREE.CylinderGeometry(0.165,0.18,0.2,16,1,true),basic(0xfff6e4)); at(lb,0,0.32,0); g.add(lb);
  return g;
}
const ICON={};

function breadUpdate(dt){

const QSLOTS=[{x:-0.9,z:-1.3},{x:0.9,z:-2.7},{x:-0.4,z:-4.1}].map(s=>({...s,busy:null,queue:true}));
function promoteQueue(){
  const free=SLOTS.filter(s=>!s.busy);
  if(free.length){
    const cu=QSLOTS.map(s=>s.busy).find(c=>c && c.st==='queue');
    if(cu){ cu.slot.busy=null; cu.slot=pick(free); cu.slot.busy=cu; cu.queued=false; cu.st='walk'; cu.walkT=0; cu.from=cu.mesh.position.clone(); cu.sx=slotScale; }
  }
  // dồn hàng lên trước
  QSLOTS.forEach((s,i)=>{ if(s.busy) return; const nxt=QSLOTS.slice(i+1).map(q=>q.busy).find(c=>c && c.st==='queue');
    if(nxt){ nxt.slot.busy=null; nxt.slot=s; s.busy=nxt; nxt.st='walk'; nxt.walkT=0; nxt.from=nxt.mesh.position.clone(); nxt.sx=slotScale; } });
}

function resize(){
  const w=stageEl.clientWidth, h=stageEl.clientHeight;
  if(!w||!h) return;
  renderer.setSize(w,h,false);
  const aspect=w/h; camera.aspect=aspect;
  // Khung hình luôn chứa đủ 3 chỗ khách; màn hẹp (điện thoại dọc) thì khách đứng sát nhau hơn
  slotScale = aspect<0.8 ? 0.62 : aspect<1.25 ? 0.8 : 1;
  const d=camera.position.z, W=8.8*slotScale;
  const needV = THREE.MathUtils.radToDeg(2*Math.atan((W/2/d)/aspect));
  const vfov = Math.min(80, Math.max(44, needV));
  camera.fov = vfov;
  // nghiêng camera để quầy bánh luôn nằm sát mép dưới khung hình
  const pitch = THREE.MathUtils.clamp(-34 + vfov/2, -12, 8);
  camTarget.set(0, camera.position.y + Math.tan(THREE.MathUtils.degToRad(pitch))*d, 0);
  camera.lookAt(camTarget);
  camera.updateProjectionMatrix();
  sandwichRoot.scale.setScalar(aspect<0.8 ? 0.72 : aspect<1.25 ? 0.85 : 1);
  fitCam(chaseCam, aspect, 64); fitCam(cutCam, aspect, 62);
}
new ResizeObserver(resize).observe(stageEl);

const clock=new THREE.Clock(); let T=0, hudTimer=0;
const ease=t=>1-Math.pow(1-t,3);
function tick(){
  const dt=Math.min(clock.getDelta(),0.05); T+=dt;

  for(const l of lanterns){ l.rotation.z=Math.sin(T*1.5+l.parent.position.z+l.position.x)*0.08; }
  for(const w of wisps){ const u=w.userData; w.position.set(u.x+Math.sin(T*0.5+u.p)*1.2, u.y+Math.sin(T*1.3+u.p)*0.4, u.z+Math.cos(T*0.4+u.p)); }
  for(const p of papers){ const u=p.userData; u.y-=dt*u.s; if(u.y<0){ u.y=8; u.x=(Math.random()-.5)*16; }
    p.position.set(u.x+Math.sin(T+u.r)*0.6,u.y,u.z); p.rotation.set(T*1.3+u.r,T+u.r,0); }
  gate.userData.portal.material.color.setScalar(0.85+Math.sin(T*2)*0.15);
  gateLight.intensity=26+Math.sin(T*3)*6;
  for(const a of anims) a(T);
  fxUpdate(dt);
  if(C && (state.phase==='chase'||state.phase==='chaseEnd')) chaseUpdate(dt);
  if(CUT) cutUpdate(dt);
  breadUpdate(dt);

  for(let i=pops.length-1;i>=0;i--){ const p=pops[i]; p.t+=dt*5; p.obj.scale.setScalar(p.t<1? Math.max(0.01,ease(p.t)*1.12) : 1); if(p.t>=1) pops.splice(i,1); }
  for(let i=flying.length-1;i>=0;i--){ const f=flying[i]; f.t+=dt*3.5; const k=Math.min(1,f.t);
    f.g.position.lerpVectors(f.from,f.to,ease(k)); f.g.position.y+=Math.sin(k*Math.PI)*1.2; f.g.scale.setScalar(f.s0*(1-k*0.6)); f.g.rotation.y=k*2;
    if(k>=1){ scene.remove(f.g); flying.splice(i,1);} }

  if(state.phase==='play'){
    if(!state.closing){
      state.timeLeft-=dt; state.spawnT-=dt;
      if(state.spawnT<=0){ spawnCustomer(); state.spawnT=(Math.max(2.0, 5.6-state.night*0.5)+rnd(0,2))*(has('denlong')?0.8:1); }
      promoteQueue();
      if(state.chaseAt>0 && state.timeLeft<=state.chaseAt){ startChaseEvent(); }
      else if(state.mysteryAt>0 && state.timeLeft<=state.mysteryAt && state.timeLeft>12){
        if(spawnCustomer('bian')){ state.mysteryAt=-1; banner('❓ Một vị <b>khách bí ẩn</b> đang tới…<br><small>Phục vụ thật nhanh và đúng món, biết đâu là quý nhân!</small>'); sfx.reveal(); }
      }
      if(state.timeLeft<=0){ state.closing=true; state.closeT=2.2; toast('Hết giờ! Đóng cửa xe bánh mỳ'); for(const cu of customers) if(cu.st!=='leave') leave(cu,'closed'); }
    } else { state.closeT-=dt; if(state.closeT<=0) closeShop(); }
    hudTimer-=dt; if(hudTimer<=0){ hudTimer=0.25; updateHud(); }
  }

  for(let i=customers.length-1;i>=0;i--){
    const cu=customers[i], m=cu.mesh; cu.t+=dt;
    if(!customers.includes(cu)) continue;
    const ud=m.userData, floaty=ud.float;
    ud.anim?.(cu.t);
    // chớp mắt
    cu.blinkT-=dt; const blinking = cu.blinkT<0;
    if(cu.blinkT<-0.13) cu.blinkT=rnd(2,5);
    ud.blink?.forEach(e=>e.scale.y=blinking?0.1:1);
    ud.arms?.forEach((a,j)=>a.rotation.x=Math.sin(cu.t*2.2+j)*0.18);
    if(cu.st==='walk'){
      cu.walkT+=dt/2.2; const k=Math.min(1,cu.walkT);
      m.position.lerpVectors(cu.from,new THREE.Vector3(cu.slot.x*cu.sx,0,cu.slot.z),ease(k));
      m.position.y=floaty?0.25+Math.sin(cu.t*3)*0.1:Math.abs(Math.sin(cu.t*9))*0.15;
      m.rotation.z=Math.sin(cu.t*9)*0.06;
      if(k>=1){ m.rotation.z=0; if(cu.slot.queue){ cu.st='queue'; } else { cu.st='wait'; sfx.bell(); renderCurrent(); } }
    } else if(cu.st==='queue'){
      m.position.y=floaty?0.25+Math.sin(cu.t*2.5)*0.12:Math.max(0,Math.sin(cu.t*2.2))*0.03;
    } else if(cu.st==='wait'){
      if(state.phase==='play' && !state.closing){
        if(!cu.partner || cu.type==='hac') cu.pat.v-=dt;   // đôi Vô Thường dùng chung một thanh kiên nhẫn
        if(cu.pat.v<=0){
          state.rep=Math.max(0,state.rep-8); state.combo=0; state.stats.left++;
          const p=screenPos(m,ud.top); floatText('Bỏ đi! −8 😊',p.x,p.y,true); sfx.bad();
          if(cu.def.mystery) mysteryReveal(cu,false,0);
          leave(cu,'gone'); if(cu.partner) leave(cu.partner,'gone');
          updateHud(); if(state.rep<=0) gameOver('rep'); continue;
        }
      }
      m.position.y=floaty?0.25+Math.sin(cu.t*2.5)*0.12:Math.max(0,Math.sin(cu.t*2.2))*0.03;
      m.scale.y=1+Math.sin(cu.t*2.2)*0.02;
      const frac=cu.pat.v/cu.pat.max;
      m.rotation.z = frac<0.3 ? Math.sin(cu.t*30)*0.03 : 0;
      cu.patEl.style.width=(frac*100)+'%';
      cu.patEl.style.background= frac>0.6?'var(--good)': frac>0.3?'var(--warn)':'var(--bad)';
    } else if(cu.st==='leave'){
      cu.walkT+=dt/1.6; const k=Math.min(1,cu.walkT);
      if(cu.jump!==undefined && cu.walkT<0.25){ m.position.y=Math.sin(cu.walkT*4*Math.PI)*0.5; }
      else { m.position.lerpVectors(cu.from,cu.to,k*k); m.position.y=Math.abs(Math.sin(cu.t*10))*0.15; }
      if(cu.shake>0){ cu.shake-=dt; m.rotation.z=Math.sin(cu.t*50)*0.12; } else m.rotation.z=0;
      m.rotation.y = cu.walkT>0.25 ? Math.sign(cu.to.x-cu.from.x)*Math.min(1,(cu.walkT-0.25)*4)*Math.PI/2 : 0;
      if(k>=1){ removeCustomer(cu); continue; }
    }
    const p=screenPos(m, ud.top+0.12);
    cu.bubble.style.transform=`translate(${p.x}px,${p.y}px) translate(-50%,-100%)`;
    if(cu.st==='wait') cu.bubble.style.opacity='1';
  }

  const shot = CUT && CUT.shots[CUT.i];
  if(shot) renderer.render(shot.scene||scene, cutCam);
  else if(CH && (state.phase==='chase'||state.phase==='chaseEnd')) renderer.render(CH.sc, chaseCam);
  else renderer.render(scene,camera);
  requestAnimationFrame(tick);
}
